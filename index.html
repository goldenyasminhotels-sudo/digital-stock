<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0f18">
<title>Digital Stock | ديجيتال ستوك</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>

<style>
*, *::before, *::after { box-sizing: border-box; }

:root[data-theme="dark"] {
  --bg: #0a0f18; --surface: #131a26; --surface-2: #1c2636; --surface-3: #283548;
  --line: #2a374a; --txt: #f0f4f8; --muted: #94a3b8; --muted-2: #64748b;
  --accent: #3b82f6; --accent-glow: rgba(59, 130, 246, 0.4);
  --ok: #10b981; --warn: #f59e0b; --danger: #ef4444;
  --radius: 16px; --radius-sm: 10px;
  --font-ar: 'Cairo', sans-serif; --font-en: 'Inter', sans-serif;
}
:root[data-theme="light"] {
  --bg: #f8fafc; --surface: #ffffff; --surface-2: #f1f5f9; --surface-3: #e2e8f0;
  --line: #cbd5e1; --txt: #0f172a; --muted: #64748b; --muted-2: #94a3b8;
  --accent: #2563eb; --accent-glow: rgba(37, 99, 235, 0.3);
  --ok: #059669; --warn: #d97706; --danger: #dc2626;
  --radius: 16px; --radius-sm: 10px;
  --font-ar: 'Cairo', sans-serif; --font-en: 'Inter', sans-serif;
}

html, body { margin: 0; padding: 0; width: 100%; min-height: 100vh; overflow-x: hidden; }
body {
  font-family: var(--font-ar);
  background-color: var(--bg); color: var(--txt);
  -webkit-font-smoothing: antialiased;
  transition: background-color 0.4s ease, color 0.4s ease;
}
html[dir="ltr"] body { font-family: var(--font-en); }

button, input, select, textarea { font-family: inherit; font-size: 15px; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }
::-webkit-scrollbar-track { background: transparent; }

/* ================================================================
   AUTH SCREEN
   ================================================================ */
#auth-screen {
  position: fixed; inset: 0; z-index: 1000;
  background: radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
              radial-gradient(circle at 90% 80%, rgba(139, 92, 246, 0.15) 0%, transparent 50%), var(--bg);
  display: flex; align-items: center; justify-content: center;
  transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.6s;
  padding: 20px;
}
#auth-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

.login-glass {
  background: color-mix(in srgb, var(--surface) 70%, transparent);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid color-mix(in srgb, var(--txt) 10%, transparent);
  border-radius: 24px; padding: 40px; width: 100%; max-width: 420px;
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
  animation: slideUp 0.6s ease-out forwards;
}
@keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

.brand-header { text-align: center; margin-bottom: 30px; }
.brand-logo {
  width: 70px; height: 70px; margin: 0 auto 15px;
  background: linear-gradient(135deg, #3b82f6, #8b5cf6);
  border-radius: 20px; display: flex; align-items: center; justify-content: center;
  font-size: 28px; color: white; font-weight: 900; font-family: var(--font-en);
  box-shadow: 0 10px 25px var(--accent-glow);
}
.brand-title { font-size: 24px; font-weight: 800; margin: 0; letter-spacing: -0.5px; }
.brand-subtitle { font-size: 14px; color: var(--muted); margin-top: 5px; }

.spinner-inline {
  display: inline-block; width: 18px; height: 18px;
  border: 2px solid rgba(255,255,255,0.35);
  border-top-color: #fff; border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ================================================================
   MAIN APP
   ================================================================ */
#app-screen {
  opacity: 0; visibility: hidden; pointer-events: none;
  transition: opacity 0.6s 0.2s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.6s;
  display: flex; flex-direction: column; min-height: 100vh;
}
#app-screen.visible { opacity: 1; visibility: visible; pointer-events: auto; }

.appbar { position: sticky; top: 0; z-index: 50;
  background: color-mix(in srgb, var(--bg) 85%, transparent);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--line); }
.appbar-in { max-width: 800px; margin: 0 auto; display: flex; align-items: center;
  gap: 12px; padding: 12px 20px 8px; }
.mini-logo { width: 40px; height: 40px; border-radius: 12px;
  background: linear-gradient(135deg, #3b82f6, #8b5cf6); display: flex;
  align-items: center; justify-content: center; color: white;
  font-weight: bold; font-family: var(--font-en); font-size: 12px;
  cursor: pointer; flex: 0 0 40px; }
.titles { flex: 1; min-width: 0; }
.t1 { font-size: 16px; font-weight: 800; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; }
.t2 { font-size: 12px; color: var(--muted); display: flex; align-items: center;
  gap: 6px; margin-top: 2px; flex-wrap: wrap; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn) 20%, transparent);
  transition: 0.3s; flex: 0 0 8px; }
.status-dot.online { background: var(--ok);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 20%, transparent); }
.top-actions { display: flex; gap: 6px; flex: 0 0 auto; }

.lang-select {
  padding: 8px 10px; border-radius: 10px; background: var(--surface-2);
  border: 1px solid var(--line); color: var(--txt); font-size: 13px;
  font-weight: 700; cursor: pointer; transition: 0.2s;
}
.lang-select:hover { background: var(--surface-3); }

/* ================================================================
   TABS — Redesigned
   ================================================================ */
.tabs {
  max-width: 800px; margin: 0 auto;
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 6px; padding: 8px 16px 14px;
}
.tab {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 10px 6px; border-radius: 12px;
  background: var(--surface-2); border: 1.5px solid var(--line);
  color: var(--muted); font-size: 12px; font-weight: 700;
  cursor: pointer; transition: 0.22s; white-space: nowrap; position: relative;
}
.tab .tab-icon { font-size: 18px; line-height: 1; }
.tab .tab-label { font-size: 11.5px; letter-spacing: 0.2px; }
.tab:hover { color: var(--txt); background: var(--surface-3); transform: translateY(-1px); }
.tab.active {
  background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 70%, #000));
  color: white; border-color: transparent;
  box-shadow: 0 8px 20px var(--accent-glow);
}
.tab .badge {
  position: absolute; top: 4px; inset-inline-end: 6px;
  min-width: 18px; height: 18px; padding: 0 5px;
  background: rgba(255,255,255,0.28); border-radius: 99px;
  font-size: 10px; font-weight: 800;
  display: grid; place-items: center; line-height: 1;
}
.tab.active .badge { background: rgba(255,255,255,0.35); }
.tab:not(.active) .badge { background: var(--surface-3); color: var(--muted); }

@media(max-width: 480px) {
  .tab { padding: 8px 4px; }
  .tab .tab-label { font-size: 10.5px; }
  .tab .tab-icon { font-size: 16px; }
}

main { max-width: 800px; margin: 0 auto; padding: 20px;
  flex: 1; width: 100%; }
.view { display: none; animation: fadeIn 0.4s ease-out; }
.view.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* ================================================================
   COMPONENTS
   ================================================================ */
.card { background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 20px; margin-bottom: 20px;
  box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
.card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
.card-head h2 { font-size: 17px; font-weight: 800; margin: 0; flex: 1; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 20%, transparent); flex: 0 0 10px; }
.hint { font-size: 12.5px; color: var(--muted); line-height: 1.5; margin: 0 0 14px; }
.pill { font-size: 10.5px; font-weight: 800; padding: 4px 10px;
  border-radius: 99px; background: var(--surface-3); color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.3px; }
.pill.ok { background: rgba(16,185,129,.2); color: var(--ok); }
.pill.warn { background: rgba(245,158,11,.2); color: var(--warn); }
.pill.acc { background: color-mix(in srgb, var(--accent) 20%, transparent); color: var(--accent); }

.field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
.field > span { font-size: 13px; font-weight: 700; color: var(--muted); }
.inp { width: 100%; background: var(--surface-2); border: 1.5px solid var(--line);
  border-radius: var(--radius-sm); color: var(--txt); padding: 12px 16px;
  font-size: 15px; transition: 0.2s; }
.inp:focus { border-color: var(--accent); background: var(--surface);
  box-shadow: 0 0 0 4px var(--accent-glow); outline: none; }
.inp::placeholder { color: var(--muted-2); }
textarea.inp { resize: vertical; min-height: 56px; line-height: 1.5; }
select.inp { cursor: pointer; }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
@media(max-width:600px) { .grid2 { grid-template-columns: 1fr; gap: 0; } }

.check-row { display: flex; align-items: center; gap: 10px;
  margin-bottom: 12px; padding: 10px 12px;
  background: var(--surface-2); border: 1.5px solid var(--line);
  border-radius: var(--radius-sm); cursor: pointer; }
.check-row input[type="checkbox"] { width: 18px; height: 18px;
  accent-color: var(--accent); cursor: pointer; flex: 0 0 18px; }
.check-row span { font-size: 13.5px; font-weight: 600; user-select: none; }

.btn { display: inline-flex; align-items: center; justify-content: center;
  gap: 8px; padding: 12px 20px; border-radius: var(--radius-sm);
  font-size: 15px; font-weight: 700; cursor: pointer; transition: 0.2s;
  border: none; text-decoration: none; }
.btn:active { transform: scale(0.98); }
.btn:disabled { opacity: 0.6; cursor: not-allowed; }
.btn.primary { background: var(--accent); color: white;
  box-shadow: 0 4px 14px var(--accent-glow); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.1);
  box-shadow: 0 6px 20px var(--accent-glow); }
.btn.ghost { background: transparent; border: 1.5px solid var(--line); color: var(--txt); }
.btn.ghost:hover { background: var(--surface-2); }
.btn.wa { background: #25D366; color: white;
  box-shadow: 0 4px 14px rgba(37, 211, 102, 0.3); }
.btn.danger { background: color-mix(in srgb, var(--danger) 15%, transparent);
  color: var(--danger); border: 1.5px solid transparent; }
.btn.danger:hover { background: color-mix(in srgb, var(--danger) 25%, transparent); }
.btn.sm { padding: 8px 14px; font-size: 13px; }
.btn.block { width: 100%; }

.icon-btn { width: 38px; height: 38px; border-radius: 10px;
  background: var(--surface-2); border: 1.5px solid var(--line); color: var(--txt);
  display: grid; place-items: center; cursor: pointer; transition: 0.2s; padding: 0;
  font-size: 15px; }
.icon-btn:hover { background: var(--surface-3); }
.icon-btn.danger:hover { background: var(--danger); color: white; border-color: var(--danger); }

/* ITEMS */
.items-head, .item-row { display: grid;
  grid-template-columns: 1fr 80px 100px 40px; gap: 8px; align-items: center; }
.items-head { font-size: 11.5px; font-weight: 800; color: var(--muted-2);
  margin-bottom: 8px; padding: 0 4px; text-transform: uppercase; }
.item-row { margin-bottom: 10px; }
@media(max-width:520px) {
  .items-head, .item-row { grid-template-columns: 1fr 60px 78px 34px; gap: 6px; }
  .item-row .inp { padding: 9px 8px; font-size: 13.5px; }
}

/* PHOTOS */
.photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 9px; }
.photo-grid:empty { display: none; }
.photo-grid:not(:empty) { margin-bottom: 12px; }
.thumb { position: relative; aspect-ratio: 4/3; border-radius: var(--radius-sm);
  overflow: hidden; border: 1.5px solid var(--line); background: var(--surface-2); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb button { position: absolute; top: 5px; inset-inline-end: 5px;
  width: 24px; height: 24px; border-radius: 50%; border: none;
  background: rgba(0,0,0,.7); color: #fff; font-size: 12px; cursor: pointer;
  display: grid; place-items: center; padding: 0; }
.thumb button:hover { background: var(--danger); }

/* SIGNATURE */
.sig-wrap { background: #fff; border-radius: var(--radius-sm);
  overflow: hidden; border: 1.5px solid var(--line); position: relative; }
.sig-wrap canvas { display: block; width: 100%; height: 140px;
  touch-action: none; cursor: crosshair; }
.sig-clear { position: absolute; top: 8px; inset-inline-start: 8px;
  background: rgba(0,0,0,.7); color: #fff; border: none; padding: 5px 10px;
  border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: 700; }
.sig-clear:hover { background: var(--danger); }

/* HISTORY TOOLS */
.hist-tools { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.hist-search { flex: 1; min-width: 180px; }
.hist-filter { padding: 9px 14px; background: var(--surface-2);
  border: 1.5px solid var(--line); border-radius: var(--radius-sm); color: var(--txt);
  font-size: 13px; cursor: pointer; font-weight: 700; transition: 0.16s;
  white-space: nowrap; }
.hist-filter:hover { border-color: var(--accent); }
.hist-filter.active { background: color-mix(in srgb, var(--accent) 20%, transparent);
  border-color: var(--accent); color: var(--accent); }

.hist-item { display: flex; align-items: center; gap: 12px;
  background: var(--surface); border: 1.5px solid var(--line);
  border-inline-start: 4px solid var(--c); border-radius: var(--radius-sm);
  padding: 12px 14px; margin-bottom: 10px; transition: 0.16s; }
.hist-item:hover { background: var(--surface-2); }
.hist-main { flex: 1; min-width: 0; }
.hist-ref { font-size: 14px; font-weight: 800; display: flex; gap: 8px;
  align-items: center; flex-wrap: wrap; }
.hist-sub { font-size: 12px; color: var(--muted); margin-top: 4px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hist-actions { display: flex; gap: 6px; flex-wrap: wrap; flex: 0 0 auto; }
@media(max-width:520px) {
  .hist-actions { gap: 4px; }
  .hist-actions .icon-btn { width: 32px; height: 32px; font-size: 13px; }
}

.empty { text-align: center; padding: 56px 20px; color: var(--muted); }
.empty .ico { font-size: 42px; opacity: 0.35; margin-bottom: 12px; }
.empty p { margin: 0; font-size: 14px; line-height: 1.6; }

/* BANNER */
.banner { padding: 11px 14px; border-radius: var(--radius-sm);
  margin-bottom: 14px; font-size: 13px; display: flex; gap: 10px;
  align-items: flex-start; line-height: 1.5; }
.banner.warn { background: rgba(245,158,11,.12);
  border: 1px solid rgba(245,158,11,.35); color: #fbbf24; }
.banner.ok { background: rgba(16,185,129,.12);
  border: 1px solid rgba(16,185,129,.35); color: #6ee7b7; }
.banner.info { background: rgba(59,130,246,.12);
  border: 1px solid rgba(59,130,246,.35); color: #93c5fd; }
.banner .b-ic { flex: 0 0 20px; text-align: center; font-size: 16px; }

/* PROFILE VIEW */
.profile-hero {
  background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 30%, var(--surface)) 0%,
                                       color-mix(in srgb, #8b5cf6 20%, var(--surface)) 100%);
  border: 1px solid var(--line); border-radius: var(--radius);
  padding: 32px 20px; text-align: center; margin-bottom: 16px;
  position: relative; overflow: hidden;
}
.profile-hero::before {
  content: ''; position: absolute; top: -50%; inset-inline-start: -20%;
  width: 200px; height: 200px; border-radius: 50%;
  background: rgba(255,255,255,0.08); pointer-events: none;
}
.profile-avatar {
  width: 90px; height: 90px; margin: 0 auto 15px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), #8b5cf6);
  display: grid; place-items: center; color: white;
  font-size: 38px; font-weight: 900; font-family: var(--font-en);
  box-shadow: 0 10px 25px var(--accent-glow);
  border: 4px solid color-mix(in srgb, var(--surface) 80%, transparent);
}
.profile-name { font-size: 22px; font-weight: 800; margin: 0 0 6px; }
.profile-role {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 14px; background: rgba(255,255,255,0.15);
  border-radius: 99px; font-size: 12.5px; font-weight: 700;
  color: var(--txt); backdrop-filter: blur(10px);
}
.profile-email { font-size: 12.5px; color: var(--muted); margin-top: 10px;
  direction: ltr; word-break: break-all; }

.stats-grid {
  display: grid; grid-template-columns: repeat(2, 1fr);
  gap: 12px; margin-bottom: 16px;
}
@media(max-width:480px) { .stats-grid { gap: 10px; } }

.stat-card {
  background: var(--surface); border: 1.5px solid var(--line);
  border-radius: var(--radius); padding: 16px 14px;
  transition: 0.2s; position: relative; overflow: hidden;
}
.stat-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.stat-card::after {
  content: ''; position: absolute; top: 0; inset-inline-end: 0;
  width: 60px; height: 60px; border-radius: 50%;
  background: var(--c, var(--accent)); opacity: 0.1; filter: blur(20px);
}
.stat-ic { font-size: 22px; margin-bottom: 8px; display: block; }
.stat-val { font-size: 26px; font-weight: 900; line-height: 1;
  font-family: var(--font-en); margin-bottom: 4px; }
.stat-lbl { font-size: 12px; color: var(--muted); font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.3px; }

.activity-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; border-radius: var(--radius-sm);
  background: var(--surface-2); margin-bottom: 8px;
  border: 1.5px solid transparent; transition: 0.15s;
  cursor: pointer;
}
.activity-item:hover { border-color: var(--line); background: var(--surface-3); }
.activity-badge {
  width: 40px; height: 40px; border-radius: 10px;
  display: grid; place-items: center; font-size: 18px;
  flex: 0 0 40px;
}
.activity-main { flex: 1; min-width: 0; }
.activity-t { font-size: 13.5px; font-weight: 800;
  display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.activity-s { font-size: 11.5px; color: var(--muted); margin-top: 3px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* MODALS */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  z-index: 2000; display: flex; align-items: center; justify-content: center;
  padding: 16px; opacity: 0; visibility: hidden; transition: 0.3s; }
.modal-overlay.open { opacity: 1; visibility: visible; }
.modal-box { background: var(--surface); width: 100%; max-width: 500px;
  border-radius: 20px; border: 1px solid var(--line);
  box-shadow: 0 25px 50px rgba(0,0,0,0.5);
  transform: scale(0.95); transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  display: flex; flex-direction: column; max-height: 92vh; }
.modal-overlay.open .modal-box { transform: scale(1); }
.modal-head { padding: 15px 20px; border-bottom: 1px solid var(--line);
  display: flex; align-items: center; justify-content: space-between; }
.modal-head h3 { margin: 0; font-size: 18px; font-weight: 800; }
.modal-body { padding: 20px; overflow-y: auto; }
.modal-foot { padding: 15px 20px; border-top: 1px solid var(--line);
  display: flex; gap: 10px; flex-wrap: wrap; }
.modal-foot .btn { flex: 1; min-width: 100px; }

#cardPreview { width: 100%; border-radius: var(--radius-sm); display: block; }
.spinner { width: 34px; height: 34px; margin: 48px auto; border-radius: 50%;
  border: 3px solid var(--line); border-top-color: var(--accent);
  animation: spin .8s linear infinite; }

.archive-status { margin-top: 12px; padding: 11px 14px;
  border-radius: var(--radius-sm); background: var(--surface-2);
  border: 1.5px solid var(--line); display: flex; gap: 10px;
  align-items: center; font-size: 13px; }
.archive-status .as-ic { width: 28px; height: 28px; border-radius: 50%;
  display: grid; place-items: center; background: var(--surface-3);
  font-size: 14px; flex: 0 0 28px; }
.archive-status.running { border-color: var(--accent); background: rgba(59,130,246,.08); }
.archive-status.running .as-ic { background: rgba(59,130,246,.2);
  color: #93c5fd; animation: spin 1.4s linear infinite; }
.archive-status.done { border-color: var(--ok); background: rgba(16,185,129,.08); }
.archive-status.done .as-ic { background: rgba(16,185,129,.25); color: #6ee7b7; }
.archive-status.err { border-color: var(--danger); background: rgba(239,68,68,.08); }
.archive-status.err .as-ic { background: rgba(239,68,68,.2); color: #fca5a5; }
.archive-status .as-main { flex: 1; min-width: 0; }
.archive-status .as-t { font-weight: 700; }
.archive-status .as-s { font-size: 11.5px; color: var(--muted); margin-top: 2px; }

/* TOAST */

function shade(hex, pct) {
  const n = parseInt(hex.slice(1), 16);
  const cl = v => Math.max(0, Math.min(255, Math.round(v)));
  const r = cl(((n>>16)&255)*(1+pct/100));
  const g = cl(((n>>8)&255)*(1+pct/100));
  const b = cl((n&255)*(1+pct/100));
  return `rgb(${r},${g},${b})`;
}

function dataURLtoBlob(dataURL) {
  const [header, base64] = dataURL.split(',');
  const mime = header.match(/:(.*?);/)[1];
  const bin = atob(base64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}

   ================================================================ */
const DB_NAME = 'ds.archive.v4';
const DB_VERSION = 1;
let _db = null;

function openArchive() {
  if (_db) return Promise.resolve(_db);
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('files')) {
        const st = db.createObjectStore('files', { keyPath: 'key' });
        st.createIndex('expireAt', 'expireAt');
        st.createIndex('ref', 'ref');
        st.createIndex('txId', 'txId');
      }
    };
    req.onsuccess = () => { _db = req.result; resolve(_db); };
    req.onerror   = () => reject(req.error);
  });
}

async function idbPut(rec) {
  const db = await openArchive();
  return new Promise((res, rej) => {
    const tx = db.transaction('files', 'readwrite');
    tx.objectStore('files').put(rec);
    tx.oncomplete = () => res();
    tx.onerror    = () => rej(tx.error);
  });
}
async function idbGet(key) {
  const db = await openArchive();
  return new Promise((res, rej) => {
    const tx = db.transaction('files', 'readonly');
    const rq = tx.objectStore('files').get(key);
    rq.onsuccess = () => res(rq.result || null);
    rq.onerror   = () => rej(rq.error);
  });
}
async function idbDeleteByRef(ref) {
  const db = await openArchive();
  return new Promise((res, rej) => {
    const tx = db.transaction('files', 'readwrite');
    const idx = tx.objectStore('files').index('ref');
    const rq = idx.openCursor(IDBKeyRange.only(ref));
    rq.onsuccess = e => { const c = e.target.result; if (!c) return; c.delete(); c.continue(); };
    tx.oncomplete = () => res();
    tx.onerror    = () => rej(tx.error);
  });
}
async function idbDeleteByTxId(txId) {
  const db = await openArchive();
  return new Promise((res, rej) => {
    const tx = db.transaction('files', 'readwrite');
    const idx = tx.objectStore('files').index('txId');
    const rq = idx.openCursor(IDBKeyRange.only(txId));
    rq.onsuccess = e => { const c = e.target.result; if (!c) return; c.delete(); c.continue(); };
    tx.oncomplete = () => res();
    tx.onerror    = () => rej(tx.error);
  });
}
async function idbPurgeExpired() {
  const db = await openArchive();
  return new Promise((res, rej) => {
    const tx = db.transaction('files', 'readwrite');
    const idx = tx.objectStore('files').index('expireAt');
    const range = IDBKeyRange.upperBound(new Date().toISOString());
    const rq = idx.openCursor(range);
    let n = 0;
    rq.onsuccess = e => { const c = e.target.result; if (!c) return; c.delete(); n++; c.continue(); };
    tx.oncomplete = () => res(n);
    tx.onerror    = () => rej(tx.error);
  });
}
async function idbSizeEstimate() {
  try {
    if (navigator.storage && navigator.storage.estimate) {
      const { usage, quota } = await navigator.storage.estimate();
      return `${(usage/1024/1024).toFixed(1)} MB / ${(quota/1024/1024).toFixed(0)} MB`;
    }
  } catch {}
  return '—';
}

function localNextSeq(prefix, dateKey) {
  const c = JSON.parse(localStorage.getItem(COUNTER_KEY) || '{}');
  const id = `${prefix}_${dateKey}`;
  const next = (c[id] || 0) + 1;
  c[id] = next;
  localStorage.setItem(COUNTER_KEY, JSON.stringify(c));
  return next;
}
function formatRef(prefix, dateKey, seq) {
  return `${prefix}-${dateKey}-${String(seq).padStart(4,'0')}`;
}

/* ================================================================
   COMMIT
   ================================================================ */
async function commitTransaction(payload) {
  const prefix  = MODULE_DEF[payload.module].prefix;
  const dateKey = new Date().toISOString().slice(0,10).replace(/-/g,'');

  if (firebaseReady) {
    const counterRef = doc(db, 'counters', `${prefix}_${dateKey}`);
    const txRef      = doc(collection(db, 'transactions'));
    let assignedRef  = null;
    await runTransaction(db, async (trx) => {
      const snap = await trx.get(counterRef);
      let nextSeq;
      if (!snap.exists()) {
        nextSeq = 1;
        trx.set(counterRef, { prefix, dateKey, seq: 1, updatedAt: serverTimestamp() });
      } else {
        nextSeq = (snap.data().seq || 0) + 1;
        trx.update(counterRef, { seq: nextSeq, updatedAt: serverTimestamp() });
      }
      assignedRef = formatRef(prefix, dateKey, nextSeq);
      trx.set(txRef, {
        ...payload,
        ref: assignedRef,
        createdAt: serverTimestamp(),
        expireAt: Timestamp.fromMillis(Date.now() + RETENTION_MS),
        archived: false, archiveUrls: null, archivedAt: null,
        createdBy: auth.currentUser?.uid || null
      });
    });
    return { id: txRef.id, ref: assignedRef };
  }

  const seq = localNextSeq(prefix, dateKey);
  const ref = formatRef(prefix, dateKey, seq);
  const id  = (crypto.randomUUID && crypto.randomUUID()) || String(Date.now());
  return { id, ref };
}

function compressImage(file, maxDim = 1100, quality = 0.78) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      let { width: w, height: h } = img;
      const scale = Math.min(1, maxDim / Math.max(w, h));
      w = Math.max(1, Math.round(w * scale));
      h = Math.max(1, Math.round(h * scale));
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? resolve(b) : reject(new Error('blob')), 'image/jpeg', quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('load')); };
    img.src = url;
  });
}

async function savePhotosLocal(txId, photoItems) {
  const expires = new Date(Date.now() + RETENTION_MS).toISOString();
  const refs = [];
  for (let i = 0; i < photoItems.length; i++) {
    const key = `photo::${txId}::${String(i).padStart(2,'0')}`;
    await idbPut({
      key, blob: photoItems[i].blob, txId, kind: 'photo',
      expireAt: expires, createdAt: new Date().toISOString()
    });
    refs.push(key);
  }
  return refs;
}

async function savePhotosFirebase(txId, photoItems) {
  const dateKey = new Date().toISOString().slice(0,10);
  const urls = [];
  for (let i = 0; i < photoItems.length; i++) {
    const path = `exits/${dateKey}/${txId}/${String(i+1).padStart(2,'0')}.jpg`;
    const r = storageRef(storage, path);
    await uploadBytes(r, photoItems[i].blob, {
      contentType: 'image/jpeg',
      cacheControl: 'public,max-age=31536000'
    });
    urls.push(await getDownloadURL(r));
  }
  return urls;
}

const _urlCache = new Map();
async function photoRefToURL(ref) {
  if (!ref) return null;
  if (ref.startsWith('http')) return ref;
  if (_urlCache.has(ref)) return _urlCache.get(ref);
  const rec = await idbGet(ref);
  if (!rec || !rec.blob) return null;
  const url = URL.createObjectURL(rec.blob);
  _urlCache.set(ref, url);
  return url;
}

/* ================================================================
   OFFLINE QUEUE
   ================================================================ */
function queueOffline(payload, moduleKey, photoItems) {
  const q = JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]');
  const jobId = (crypto.randomUUID && crypto.randomUUID()) || String(Date.now());
  const photoKeys = [];
  q.push({ id: jobId, payload, moduleKey, photoKeys, queuedAt: new Date().toISOString() });
  localStorage.setItem(QUEUE_KEY, JSON.stringify(q));
  (async () => {
    for (let i = 0; i < photoItems.length; i++) {
      const key = `queue::${jobId}::${String(i).padStart(2,'0')}`;
      await idbPut({
        key, blob: photoItems[i].blob, kind: 'queue-photo',
        expireAt: new Date(Date.now() + 7*24*3600*1000).toISOString()
      });
      photoKeys.push(key);
    }
    const fresh = JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]');
    const idx = fresh.findIndex(j => j.id === jobId);
    if (idx >= 0) {
      fresh[idx].photoKeys = photoKeys;
      localStorage.setItem(QUEUE_KEY, JSON.stringify(fresh));
    }
  })();
}

async function flushOfflineQueue() {
  if (!firebaseReady || !navigator.onLine) return;
  const q = JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]');
  if (!q.length) return;
  const remaining = [];
  let synced = 0;
  for (const job of q) {
    try {
      const photoItems = [];
      for (const k of job.photoKeys || []) {
        const rec = await idbGet(k);
        if (rec && rec.blob) photoItems.push({ blob: rec.blob });
      }
      const tempId = (crypto.randomUUID && crypto.randomUUID()) || String(Date.now());
      const photoRefs = await savePhotosFirebase(tempId, photoItems);
      const { id, ref } = await commitTransaction({ ...job.payload, photos: photoRefs });
      const cached = loadAll();
      cached.unshift({
        id, ref, ...job.payload, photos: photoRefs,
        createdAt: new Date().toISOString(),
        expireAt: new Date(Date.now() + RETENTION_MS).toISOString(),
        archived: false
      });
      saveAll(cached);
      synced++;
    } catch (e) { remaining.push(job); }
  }
  localStorage.setItem(QUEUE_KEY, JSON.stringify(remaining));
  if (synced) {
    renderHistory();
    renderProfile();
    renderHistoryBanner();
  }
}

/* ================================================================
   RENDER: FORMS
   ================================================================ */
function renderForms() {
  ['warehouse','bon'].forEach(key => {
    const host = document.getElementById('view-' + key);
    host.innerHTML = formHtml(key);
    addItemRow(key);
    initSignature(key);

    // Event delegation (single listener per form)
    if (host._delegated) return;
    host._delegated = true;

    host.addEventListener('click', e => {
      const addBtn = e.target.closest('[data-add-item]');
      if (addBtn) return addItemRow(addBtn.dataset.addItem);
      const del = e.target.closest('.del');
      if (del && del.closest('.item-row')) return removeItemRow(del);
      const cam = e.target.closest('[data-cam]');
      if (cam) return openPicker(cam.dataset.cam, true);
      const gal = e.target.closest('[data-gal]');
      if (gal) return openPicker(gal.dataset.gal, false);
      const sigClr = e.target.closest('[data-sig-clear]');
      if (sigClr) return clearSignature(sigClr.dataset.sigClear);
    });

    host.addEventListener('change', e => {
      if (e.target.matches('[data-guard-override]')) {
        const field = host.querySelector('[data-guard-field]');
        if (field) field.style.display = e.target.checked ? 'flex' : 'none';
      }
    });

    host.addEventListener('submit', e => {
      e.preventDefault();
      handleSubmit(key);
    });

    host.addEventListener('reset', () => {
      setTimeout(() => {
        drafts[key].forEach(p => { try { URL.revokeObjectURL(p.url); } catch {} });
        drafts[key] = [];
        signatures[key] = null;
        renderPhotos(key);
        clearSignature(key);
        const items = document.getElementById('items-' + key);
        if (items) items.innerHTML = '';
        addItemRow(key);
        const gc = host.querySelector('[data-guard-override]');
        if (gc) gc.checked = false;
        const gf = host.querySelector('[data-guard-field]');
        if (gf) gf.style.display = 'none';
      }, 0);
    });
  });
  refreshDatalists();
}

function addItemRow(key) {
  const wrap = document.getElementById('items-' + key);
  if (!wrap) return;
  const div = document.createElement('div');
  div.innerHTML = itemRowHtml();
  wrap.appendChild(div.firstElementChild);
}

function removeItemRow(btn) {
  const row = btn.closest('.item-row');
  const wrap = row.parentElement;
  row.remove();
  if (!wrap.children.length) {
    addItemRow(wrap.id.replace('items-',''));
  }
}

/* ================================================================
   SIGNATURE
   ================================================================ */
function initSignature(key) {
  const canvas = document.getElementById('sig-' + key);
  if (!canvas || canvas._initialized) return;
  canvas._initialized = true;

  const ctx = canvas.getContext('2d');
  let drawing = false;

  function resize() {
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#0f172a';
  }
  resize();
  window.addEventListener('resize', () => {
    const sig = signatures[key];
    resize();
    if (sig) {
      const i = new Image();
      i.onload = () => ctx.drawImage(i, 0, 0, canvas.width, canvas.height);
      i.src = sig;
    }
  });

  const getPos = e => {
    const rect = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x: p.clientX - rect.left, y: p.clientY - rect.top };
  };
  const start = e => { e.preventDefault(); drawing = true; const { x, y } = getPos(e); ctx.beginPath(); ctx.moveTo(x, y); };
  const move  = e => { if (!drawing) return; e.preventDefault(); const { x, y } = getPos(e); ctx.lineTo(x, y); ctx.stroke(); };
  const end   = () => { if (!drawing) return; drawing = false; try { signatures[key] = canvas.toDataURL('image/png'); } catch {} };

  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  canvas.addEventListener('mouseup', end);
  canvas.addEventListener('mouseleave', end);
  canvas.addEventListener('touchstart', start, { passive: false });
  canvas.addEventListener('touchmove', move, { passive: false });
  canvas.addEventListener('touchend', end);
}

function clearSignature(key) {
  const canvas = document.getElementById('sig-' + key);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  signatures[key] = null;
}

/* ================================================================
   PHOTOS
   ================================================================ */
function openPicker(key, useCamera) {
  if (drafts[key].length >= MAX_PHOTOS) return toast(t('form.maxPhotos'));
  const input = document.getElementById('fileInput');
  if (useCamera) input.setAttribute('capture', 'environment');
  else input.removeAttribute('capture');
  input.value = '';
  input.onchange = async () => {
    const files = [...(input.files || [])];
    for (const f of files) {
      if (drafts[key].length >= MAX_PHOTOS) { toast(t('form.maxPhotos')); break; }
      try {
        const blob = await compressImage(f);
        drafts[key].push({ blob, url: URL.createObjectURL(blob), size: blob.size });
      } catch { }
    }
    renderPhotos(key);
  };
  input.click();
}

function renderPhotos(key) {
  const grid = document.getElementById('pg-' + key);
  if (!grid) return;
  grid.innerHTML = drafts[key].map((p, i) => `
    <div class="thumb">
      <img src="${p.url}" alt="photo ${i+1}">
      <button type="button" data-rm-photo="${i}">✕</button>
    </div>`).join('');
  const counter = document.getElementById('pc-' + key);
  if (counter) counter.textContent = `${drafts[key].length} / ${MAX_PHOTOS}`;
  grid.onclick = e => {
    const b = e.target.closest('[data-rm-photo]');
    if (!b) return;
    const i = Number(b.dataset.rmPhoto);
    try { URL.revokeObjectURL(drafts[key][i].url); } catch {}
    drafts[key].splice(i, 1);
    renderPhotos(key);
  };
}

function refreshDatalists() {
  const all = loadAll();
  const staff = [...new Set(all.map(t => t.staff).filter(Boolean))];
  $$('#dl-staff').forEach(el => {
    el.innerHTML = staff.map(v => `<option value="${esc(v)}">`).join('');
  });
}

/* ================================================================
   CARD GENERATION
   ================================================================ */
function rr(ctx, x, y, w, h, r) {
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function loadImg(src) {
  return new Promise((res, rej) => {
    const i = new Image();
    i.crossOrigin = 'anonymous';
    i.onload = () => res(i);
    i.onerror = () => rej(new Error('img'));
    i.src = src;
  });
}
function wrapText(ctx, text, maxW) {
  const words = String(text).split(/\s+/);
  const lines = []; let cur = '';
  for (const w of words) {
    const test = cur ? cur + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = w; }
    else cur = test;
  }
  if (cur) lines.push(cur);
  return lines.length ? lines : [''];
}

async function generateCard(tx) {
  const W = 1080, PAD = 52, CW = W - PAD * 2;
  const accent = MODULE_DEF[tx.module].accent;
  const rtl = currentLang === 'ar';

  const cv = document.createElement('canvas');
  cv.width = W; cv.height = 5400;
  const ctx = cv.getContext('2d');
  const F = (w, s) => `${w} ${s}px "Cairo", -apple-system, "Segoe UI", Roboto, sans-serif`;
  ctx.textBaseline = 'alphabetic';
  ctx.direction = rtl ? 'rtl' : 'ltr';

  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, cv.height);

  let y = 0;

  // Header
  const HEAD = 200;
  const grad = ctx.createLinearGradient(0, 0, W, HEAD);
  grad.addColorStop(0, accent);
  grad.addColorStop(1, shade(accent, -22));
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, HEAD);

  const alignText = rtl ? 'right' : 'left';
  const alignX = rtl ? W - PAD : PAD;
  const dirInverted = rtl ? 1 : -1;

  ctx.textAlign = alignText;
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  ctx.font = F(600, 26);
  ctx.fillText(settings.hotel || '', alignX, 64);

  ctx.fillStyle = '#ffffff';
  ctx.font = F(800, 48);
  ctx.fillText(t('mod.' + tx.module + '.title'), alignX, 126);

  ctx.font = F(500, 24);
  ctx.fillStyle = 'rgba(255,255,255,.86)';
  ctx.fillText(t('mod.' + tx.module + '.subtitle'), alignX, 168);

  y = HEAD;

  // Info strip
  const STRIP = 92;
  ctx.fillStyle = '#f7f9fc';
  ctx.fillRect(0, y, W, STRIP);
  ctx.strokeStyle = '#e3e8ef'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, y + STRIP + .5); ctx.lineTo(W, y + STRIP + .5); ctx.stroke();

  const cells = [
    [currentLang === 'ar' ? 'الرقم المرجعي' : currentLang === 'fr' ? 'RÉFÉRENCE' : 'REFERENCE', tx.ref],
    [currentLang === 'ar' ? 'التاريخ' : currentLang === 'fr' ? 'DATE' : 'DATE', fmtDate(tx.createdAt)],
    [currentLang === 'ar' ? 'الساعة' : currentLang === 'fr' ? 'HEURE' : 'TIME', fmtTime(tx.createdAt)]
  ];
  const cellW = CW / 3;
  cells.forEach(([lab, val], i) => {
    const x = alignX + dirInverted * (i * cellW + cellW);
    ctx.textAlign = alignText;
    ctx.fillStyle = '#8a94a6'; ctx.font = F(700, 19);
    ctx.fillText(lab, x, y + 36);
    ctx.fillStyle = '#0f172a'; ctx.font = F(700, 30);
    ctx.fillText(val, x, y + 72);
  });
  y += STRIP;

  const sectionTitle = (text) => {
    y += 46;
    const barX = rtl ? W - PAD - 5 : PAD;
    ctx.fillStyle = accent;
    ctx.fillRect(barX, y - 22, 5, 26);
    ctx.fillStyle = '#0f172a';
    ctx.font = F(800, 25);
    ctx.textAlign = alignText;
    const tx2 = rtl ? W - PAD - 18 : PAD + 18;
    ctx.fillText(text, tx2, y);
    y += 22;
  };

  const infoBoxes = (pairs) => {
    const gap = 20;
    const bw = (CW - gap) / 2;
    const bh = 100;
    for (let i = 0; i < pairs.length; i += 2) {
      const row = pairs.slice(i, i + 2);
      row.forEach(([lab, val], j) => {
        const x = rtl
          ? W - PAD - (j + 1) * bw - j * gap
          : PAD + j * (bw + gap);
        ctx.fillStyle = '#f7f9fc';
        rr(ctx, x, y, bw, bh, 14); ctx.fill();
        const barX2 = rtl ? x + bw - 6 : x;
        ctx.fillStyle = accent;
        rr(ctx, barX2, y, 6, bh, 3); ctx.fill();

        ctx.textAlign = alignText;
        ctx.fillStyle = '#8a94a6'; ctx.font = F(700, 19);
        const txLab = rtl ? x + bw - 24 : x + 24;
        ctx.fillText(lab, txLab, y + 36);

        ctx.fillStyle = '#0f172a'; ctx.font = F(600, 29);
        const lines = wrapText(ctx, val || '—', bw - 48);
        ctx.fillText(lines[0], txLab, y + 74);
      });
      y += bh + gap;
    }
    y -= gap;
  };

  sectionTitle(currentLang === 'ar' ? 'الأفراد' : currentLang === 'fr' ? 'PERSONNEL' : 'PERSONNEL');
  y += 14;
  infoBoxes([
    [currentLang === 'ar' ? 'حارس الأمن' : currentLang === 'fr' ? 'Agent de sécurité' : 'Security guard', tx.guard],
    [currentLang === 'ar' ? 'الموظف المستخرج' : currentLang === 'fr' ? 'Personnel prélevant' : 'Extracting staff', tx.staff]
  ]);

  sectionTitle(currentLang === 'ar' ? 'تفاصيل الحركة' : currentLang === 'fr' ? 'DÉTAILS DU MOUVEMENT' : 'MOVEMENT DETAILS');
  y += 14;
  const details = [];
  if (tx.module === 'warehouse') {
    details.push([t('form.department'), tx.department]);
    if (tx.po) details.push([t('form.po'), tx.po]);
  } else {
    details.push([t('form.destination'), tx.destination]);
    details.push([t('form.reason'), tx.reason]);
    if (tx.vehicle)      details.push([t('form.vehicle'), tx.vehicle]);
    if (tx.authorizedBy) details.push([t('form.authorizedBy'), tx.authorizedBy]);
  }
  infoBoxes(details);

  sectionTitle((currentLang === 'ar' ? 'الأصناف' : currentLang === 'fr' ? 'ARTICLES' : 'ITEMS') + ` (${tx.items.length})`);
  y += 14;

  const ROW_H = 54;
  const colQty = 150, colUnit = 150;

  ctx.fillStyle = '#eef2f7';
  rr(ctx, PAD, y, CW, 46, 10); ctx.fill();
  ctx.fillStyle = '#475569'; ctx.font = F(700, 20);
  ctx.textAlign = rtl ? 'right' : 'left';
  ctx.fillText(t('form.items.name'), rtl ? W - PAD - 18 : PAD + 18, y + 30);
  ctx.textAlign = 'center';
  ctx.fillText(t('form.items.qty'), W / 2 - colUnit/4, y + 30);
  ctx.textAlign = 'right';
  ctx.fillText(t('form.items.unit'), rtl ? PAD + colUnit : W - PAD - 18, y + 30);
  y += 46;

  tx.items.forEach((it, i) => {
    if (i % 2 === 1) {
      ctx.fillStyle = '#fafbfc';
      ctx.fillRect(PAD, y, CW, ROW_H);
    }
    ctx.strokeStyle = '#e9edf3'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(PAD, y + ROW_H + .5); ctx.lineTo(PAD + CW, y + ROW_H + .5); ctx.stroke();

    ctx.fillStyle = '#0f172a'; ctx.font = F(600, 25);
    ctx.textAlign = rtl ? 'right' : 'left';
    ctx.fillText(wrapText(ctx, it.name, CW - 300 - 40)[0],
                 rtl ? W - PAD - 18 : PAD + 18, y + 35);

    ctx.textAlign = 'center';
    ctx.font = F(700, 25);
    ctx.fillText(it.qty, W / 2 - colUnit/4, y + 35);
    ctx.fillStyle = '#475569'; ctx.font = F(600, 23);
    ctx.textAlign = 'right';
    ctx.fillText(it.unit, rtl ? PAD + colUnit : W - PAD - 18, y + 35);

    y += ROW_H;
  });

  if (tx.notes) {
    sectionTitle(currentLang === 'ar' ? 'ملاحظات' : currentLang === 'fr' ? 'OBSERVATIONS' : 'NOTES');
    y += 16;
    ctx.fillStyle = '#0f172a'; ctx.font = F(500, 25);
    ctx.textAlign = rtl ? 'right' : 'left';
    const lines = wrapText(ctx, tx.notes, CW - 36);
    lines.slice(0, 5).forEach(l => {
      ctx.fillText(l, rtl ? W - PAD - 18 : PAD + 18, y + 20);
      y += 36;
    });
  }

  // Photos with watermark
  if (tx.photos && tx.photos.length) {
    sectionTitle((currentLang === 'ar' ? 'الصور التوثيقية' : currentLang === 'fr' ? 'PREUVES PHOTOGRAPHIQUES' : 'PHOTO EVIDENCE') + ` (${tx.photos.length})`);
    y += 18;

    const GAP = 18, COLS = 3;
    const cellW = (CW - GAP * (COLS - 1)) / COLS;
    const cellH = cellW * 0.75;
    const WM_H = 30;

    const imgs = [];
    for (const ref of tx.photos.slice(0, 6)) {
      try {
        const url = await photoRefToURL(ref);
        if (url) imgs.push(await loadImg(url));
      } catch {}
    }

    imgs.forEach((img, i) => {
      const col = i % COLS, row = Math.floor(i / COLS);
      const x = PAD + col * (cellW + GAP);
      const yy = y + row * (cellH + GAP);

      ctx.save();
      rr(ctx, x, yy, cellW, cellH, 12); ctx.clip();
      const ir = img.width / img.height, br = cellW / cellH;
      let dw, dh;
      if (ir > br) { dh = cellH; dw = cellH * ir; }
      else { dw = cellW; dh = cellW / ir; }
      ctx.drawImage(img, x + (cellW - dw) / 2, yy + (cellH - dh) / 2, dw, dh);

      ctx.fillStyle = 'rgba(0,0,0,.72)';
      ctx.fillRect(x, yy + cellH - WM_H, cellW, WM_H);
      ctx.fillStyle = '#ffffff';
      ctx.font = F(600, 13);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(`${tx.ref} • ${fmtTime(tx.createdAt)}`,
                   x + cellW/2, yy + cellH - WM_H/2);
      ctx.textBaseline = 'alphabetic';
      ctx.restore();

      ctx.save();
      rr(ctx, x, yy, cellW, cellH, 12);
      ctx.strokeStyle = '#dfe5ec'; ctx.lineWidth = 2; ctx.stroke();
      ctx.restore();
    });

    const rows = Math.ceil(imgs.length / COLS);
    y += rows * cellH + Math.max(0, rows - 1) * GAP;
  }

  // Signatures
  y += 64;
  const sigW = (CW - 60) / 2;
  const sigH = 100;
  const sigKeys = ['guardSignature', 'staffSignature'];
  const sigLabels = currentLang === 'ar'
    ? ['توقيع حارس الأمن', 'توقيع الموظف']
    : currentLang === 'fr'
    ? ['Signature — Agent de sécurité', 'Signature — Personnel prélevant']
    : ['Signature — Security guard', 'Signature — Extracting staff'];

  for (let i = 0; i < 2; i++) {
    const x = rtl
      ? W - PAD - (i + 1) * sigW - i * 60
      : PAD + i * (sigW + 60);
    const sigData = tx[sigKeys[i]];
    if (sigData) {
      try {
        const sigImg = await loadImg(sigData);
        ctx.drawImage(sigImg, x, y - sigH + 20, sigW, sigH - 20);
      } catch {}
    }
    ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + sigW, y); ctx.stroke();
    ctx.fillStyle = '#8a94a6'; ctx.font = F(600, 20);
    ctx.textAlign = 'center';
    ctx.fillText(sigLabels[i], x + sigW/2, y + 30);
  }

  y += 78;
  ctx.strokeStyle = '#e3e8ef'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(PAD, y + .5); ctx.lineTo(PAD + CW, y + .5); ctx.stroke();
  y += 34;
  ctx.fillStyle = '#94a3b8'; ctx.font = F(500, 18);
  ctx.textAlign = 'center';
  ctx.fillText(`• ${settings.hotel} • ${fmtDateTime(new Date())} •`, W / 2, y);

  const finalH = y + PAD;
  const out = document.createElement('canvas');
  out.width = W; out.height = finalH;
  const octx = out.getContext('2d');
  octx.fillStyle = '#ffffff';
  octx.fillRect(0, 0, W, finalH);
  octx.drawImage(cv, 0, 0, W, finalH, 0, 0, W, finalH);

  return out.toDataURL('image/jpeg', 0.92);
}

/* ================================================================
   PDF / JSON
   ================================================================ */
async function buildPdfBlob(tx, cardDataUrl) {
  if (!window.jspdf || !window.jspdf.jsPDF) throw new Error('jsPDF not loaded');
  const dataUrl = cardDataUrl || await generateCard(tx);
  const img = await loadImg(dataUrl);
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ unit: 'pt', format: 'a4', compress: true });
  const pageW = pdf.internal.pageSize.getWidth();
  const pageH = pdf.internal.pageSize.getHeight();
  const margin = 18;
  const availW = pageW - margin * 2;
  const availH = pageH - margin * 2;
  const ratio = img.width / img.height;
  let w = availW, h = w / ratio;
  if (h > availH) { h = availH; w = h * ratio; }
  const x = (pageW - w) / 2;
  const y = margin + (availH - h) / 2;
  pdf.addImage(dataUrl, 'JPEG', x, y, w, h);
  return pdf.output('blob');
}

function buildJsonBlob(tx) {
  return new Blob([JSON.stringify({
    schema: 'digitalstock.exit.v2',
    exportedAt: new Date().toISOString(),
    reference: tx.ref,
    module: tx.module,
    hotel: tx.hotel || settings.hotel,
    guard: tx.guard,
    staff: tx.staff,
    department: tx.department || null,
    destination: tx.destination || null,
    reason: tx.reason || null,
    vehicle: tx.vehicle || null,
    authorizedBy: tx.authorizedBy || null,
    notes: tx.notes || null,
    items: tx.items,
    photos: tx.photos || [],
    createdAt: tx.createdAt,
    expireAt: tx.expireAt || null,
    hasSignatures: { guard: !!tx.guardSignature, staff: !!tx.staffSignature }
  }, null, 2)], { type: 'application/json' });
}

/* ================================================================
   ARCHIVE
   ================================================================ */
async function archiveTransaction(tx, pdfBlob, jsonBlob, cardUrl) {
  const expires = new Date(Date.now() + RETENTION_MS).toISOString();
  if (firebaseReady) {
    const dateKey = new Date().toISOString().slice(0,10);
    const base = `archive/${dateKey}/${tx.ref}`;
    const pdfR  = storageRef(storage, `${base}/${tx.ref}.pdf`);
    const jsonR = storageRef(storage, `${base}/${tx.ref}.json`);
    await uploadBytes(pdfR, pdfBlob, { contentType: 'application/pdf' });
    await uploadBytes(jsonR, jsonBlob, { contentType: 'application/json' });
    const pdfUrl  = await getDownloadURL(pdfR);
    const jsonUrl = await getDownloadURL(jsonR);
    if (tx.id) {
      try {
        await updateDoc(doc(db, 'transactions', tx.id), {
          archived: true, archivedAt: serverTimestamp(),
          archiveUrls: { pdf: pdfUrl, json: jsonUrl }
        });
      } catch {}
    }
    return { pdf: pdfUrl, json: jsonUrl };
  }
  await idbPut({ key: `archive::${tx.ref}::pdf`, blob: pdfBlob,
                 ref: tx.ref, kind: 'pdf', expireAt: expires,
                 createdAt: new Date().toISOString() });
  await idbPut({ key: `archive::${tx.ref}::json`, blob: jsonBlob,
                 ref: tx.ref, kind: 'json', expireAt: expires,
                 createdAt: new Date().toISOString() });
  if (cardUrl) {
    try {
      await idbPut({ key: `archive::${tx.ref}::jpg`,
                     blob: dataURLtoBlob(cardUrl),
                     ref: tx.ref, kind: 'jpg', expireAt: expires,
                     createdAt: new Date().toISOString() });
    } catch {}
  }
  return { pdf: `idb://${tx.ref}::pdf`, json: `idb://${tx.ref}::json` };
}

async function recoverUnarchived() {
  const all = loadAll();
  const unarchived = all.filter(t => !t.archived && t.id && t.ref);
  if (!unarchived.length) return;
  for (const tx of unarchived) {
    try {
      if (!firebaseReady) {
        const stored = await idbGet(`archive::${tx.ref}::pdf`);
        if (stored && stored.blob) { tx.archived = true; continue; }
      }
      const cardUrl = await generateCard(tx);
      const pdf = await buildPdfBlob(tx, cardUrl);
      const json = buildJsonBlob(tx);
      await archiveTransaction(tx, pdf, json, cardUrl);
      tx.archived = true;
    } catch {}
  }
  saveAll(all);
  renderHistory();
  renderProfile();
}

/* ================================================================
   RETENTION
   ================================================================ */
async function purgeExpired() {
  const cutoff = Date.now() - RETENTION_MS;
  const all = loadAll();
  const keep = all.filter(t => {
    const ts = new Date(t.createdAt).getTime();
    return isFinite(ts) && ts > cutoff;
  });
  const removed = all.length - keep.length;
  if (removed > 0) { saveAll(keep); renderHistory(); renderProfile(); refreshDatalists(); }
  try { await idbPurgeExpired(); } catch {}
}

function startRetentionScheduler() {
  purgeExpired().catch(() => {});
  setInterval(() => purgeExpired().catch(() => {}), 10 * 60 * 1000);
}

function buildMessage(tx) {
  const L = [];
  L.push(`*${t('mod.' + tx.module + '.title')}*`);
  L.push(`🏨 ${tx.hotel || settings.hotel}`);
  L.push(`📄 ${tx.ref}`);
  L.push(`🕒 ${fmtDateTime(tx.createdAt)}`);
  L.push('');
  L.push(`👮 ${tx.guard}`);
  L.push(`👤 ${tx.staff}`);
  if (tx.department)   L.push(`🏷 ${tx.department}`);
  if (tx.po)           L.push(`🔖 ${tx.po}`);
  if (tx.destination)  L.push(`📍 ${tx.destination}`);
  if (tx.reason)       L.push(`📌 ${tx.reason}`);
  if (tx.vehicle)      L.push(`🚚 ${tx.vehicle}`);
  if (tx.authorizedBy) L.push(`✅ ${tx.authorizedBy}`);
  L.push('');
  L.push(`*${t('form.items')} (${tx.items.length}):*`);
  tx.items.forEach((it, i) => L.push(`${i+1}. ${it.name} — ${it.qty} ${it.unit}`));
  if (tx.notes) { L.push(''); L.push(`📝 ${tx.notes}`); }
  L.push('');
  L.push(`📷 ${(tx.photos || []).length} ${currentLang === 'ar' ? 'صور' : currentLang === 'fr' ? 'photo(s)' : 'photo(s)'}`);
  return L.join('\n');
}

function waNumber() { return (settings.phone || '').replace(/[^\d]/g, ''); }

async function shareWhatsApp() {
  if (!activeTx) return toast(t('card.noActive'));
  const text = buildMessage(activeTx);

  if (activeCardUrl && navigator.canShare && navigator.share) {
    try {
      const blob = dataURLtoBlob(activeCardUrl);
      const file = new File([blob], `${activeTx.ref}.jpg`, { type: 'image/jpeg' });
      if (navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], text, title: activeTx.ref });
        return;
      }
    } catch (err) { if (err?.name === 'AbortError') return; }
  }
  const num = waNumber();
  const base = num ? `https://wa.me/${num}` : 'https://wa.me/';
  window.open(`${base}?text=${encodeURIComponent(text)}`, '_blank');
  if (activeCardUrl) {
    downloadDataUrl(activeCardUrl, `${activeTx.ref}.jpg`);
  }
}

function downloadDataUrl(url, filename) {
  if (!url) return;
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
}
function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  downloadDataUrl(url, filename);
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

   SUBMIT
   ================================================================ */
async function handleSubmit(key) {
  const form = document.getElementById('form-' + key);
  const fd = new FormData(form);

  const staff = (fd.get('staff') || '').trim();
  if (!staff) { toast(t('form.staff.required')); form.staff.focus(); return; }

  const overrideCb = form.querySelector('[data-guard-override]');
  const guardOverride = (fd.get('guardOverride') || '').trim();
  let effectiveGuard = currentAgent;
  if (overrideCb && overrideCb.checked) {
    if (!guardOverride) return toast(t('form.guard.required'));
    effectiveGuard = guardOverride;
  }

  const items = $$('.item-row', form).map(r => ({
    name: r.querySelector('.i-name').value.trim(),
    qty:  r.querySelector('.i-qty').value.trim(),
    unit: r.querySelector('.i-unit').value
  })).filter(i => i.name);

  if (!items.length) return toast(t('form.items.required'));
  if (items.some(i => !i.qty)) return toast(t('form.qty.required'));

  if (key === 'bon') {
    if (!(fd.get('destination') || '').trim()) return toast(t('form.destination.required'));
    if (!(fd.get('reason') || '').trim())      return toast(t('form.reason.required'));
  } else {
    if (!(fd.get('department') || '').trim()) return toast(t('form.department.required'));
  }

  if (!drafts[key].length && !confirm(t('form.noPhotos'))) return;

  const submitBtn = form.querySelector('button[type="submit"]');
  submitBtn.disabled = true;
  const oldLabel = submitBtn.innerHTML;
  submitBtn.innerHTML = `<span class="spinner-inline"></span> ${t('form.submit.loading')}`;

  const payload = {
    module: key,
    hotel: settings.hotel,
    guard: effectiveGuard,
    staff,
    department:   (fd.get('department') || '').trim(),
    po:           (fd.get('po') || '').trim(),
    destination:  (fd.get('destination') || '').trim(),
    reason:       (fd.get('reason') || '').trim(),
    vehicle:      (fd.get('vehicle') || '').trim(),
    authorizedBy: (fd.get('authorizedBy') || '').trim(),
    notes:        (fd.get('notes') || '').trim(),
    items,
    guardSignature: signatures[key] || null,
    staffSignature: null,
    clientTimestamp: new Date().toISOString()
  };

  let record = null;
  try {
    const tempId = (crypto.randomUUID && crypto.randomUUID()) || String(Date.now());
    let photoRefs;
    if (firebaseReady && navigator.onLine) {
      photoRefs = await savePhotosFirebase(tempId, drafts[key]);
    } else {
      photoRefs = await savePhotosLocal(tempId, drafts[key]);
    }
    const { id, ref } = await commitTransaction({ ...payload, photos: photoRefs });

    const createdAt = new Date().toISOString();
    const expireAt  = new Date(Date.now() + RETENTION_MS).toISOString();
    record = {
      id, ref, ...payload, photos: photoRefs,
      createdAt, expireAt, archived: false, archiveUrls: null
    };

    const cached = loadAll();
    cached.unshift(record);
    saveAll(cached);

    form.reset();
    drafts[key].forEach(p => { try { URL.revokeObjectURL(p.url); } catch {} });
    drafts[key] = [];
    signatures[key] = null;
    renderPhotos(key);
    clearSignature(key);
    document.getElementById('items-' + key).innerHTML = '';
    addItemRow(key);
    refreshDatalists();
    renderHistory();
    renderProfile();
    toast(`${t('form.saved')} ${ref}`);
  } catch (err) {
    console.error(err);
    queueOffline(payload, key, drafts[key]);
    toast(t('form.offline'));
    submitBtn.disabled = false;
    submitBtn.innerHTML = oldLabel;
    return;
  }

  submitBtn.disabled = false;
  submitBtn.innerHTML = oldLabel;
  activeTx = record;
  await showCard(record);
}

async function showCard(tx) {

  activeCardUrl = null;
  document.getElementById('cardModalTitle').textContent = tx.ref;
  document.getElementById('cardModalBody').innerHTML = '<div class="spinner"></div>';
  document.getElementById('archiveStatus').style.display = 'none';
  document.getElementById('cardModal').classList.add('open');

  try {
    const url = await generateCard(tx);
    activeCardUrl = url;
    document.getElementById('cardModalBody').innerHTML =
      `<img id="cardPreview" src="${url}" alt="${esc(tx.ref)}">`;
  } catch (e) {
    document.getElementById('cardModalBody').innerHTML = `
      <div class="banner warn" style="margin:0">
        <span class="b-ic">⚠</span>
        <span>${t('card.genError')}<br><small>${esc(e.message || e)}</small></span>
      </div>`;

async function runBackgroundArchive(tx, cardUrl) {
  const status = document.getElementById('archiveStatus');
  const icon = document.getElementById('archiveIcon');
  const text = document.getElementById('archiveText');
  const sub  = document.getElementById('archiveSub');

  status.style.display = 'flex';
  status.className = 'archive-status running';
  icon.textContent = '⟳';
  text.textContent = t('archive.running');
  sub.textContent = t('archive.compiling');

  let pdfBlob = null, jsonBlob = null;
  try { pdfBlob = await buildPdfBlob(tx, cardUrl); } catch {}
  try { jsonBlob = buildJsonBlob(tx); } catch {}

  if (!pdfBlob || !jsonBlob) {
    status.className = 'archive-status err';
    icon.textContent = '✕';
    text.textContent = t('archive.partial');
    return;
  }
  sub.textContent = `PDF ${(pdfBlob.size/1024).toFixed(0)} KB • JSON ${(jsonBlob.size/1024).toFixed(1)} KB`;

  try {
    await archiveTransaction(tx, pdfBlob, jsonBlob, cardUrl);
    status.className = 'archive-status done';
    icon.textContent = '✓';
    text.textContent = firebaseReady ? t('archive.cloud') : t('archive.local');
    sub.textContent = `${t('archive.autoPurge')} ${fmtTime(tx.expireAt)} (48${t('archive.hours')})`;
    const all = loadAll();
    const idx = all.findIndex(t => t.id === tx.id);
    if (idx >= 0) { all[idx].archived = true; saveAll(all); renderHistory(); renderProfile(); }
  } catch (e) {
    status.className = 'archive-status err';
    icon.textContent = '!';
    text.textContent = t('archive.failed');
    sub.textContent = e.message || t('archive.failedHint');
  }
}

/* ================================================================
   HISTORY
   ================================================================ */
function filterRecords(all) {
  let f = all;
  if (historyFilter !== 'all') f = f.filter(t => t.module === historyFilter);
  if (historyQuery) {
    const q = historyQuery.toLowerCase();
    f = f.filter(t =>
      (t.ref || '').toLowerCase().includes(q) ||
      (t.guard || '').toLowerCase().includes(q) ||
      (t.staff || '').toLowerCase().includes(q) ||
      (t.destination || '').toLowerCase().includes(q) ||
      (t.department || '').toLowerCase().includes(q) ||
      (t.items || []).some(it => (it.name || '').toLowerCase().includes(q))
    );
  }
  return f;
}

function renderHistory() {
  const all = loadAll();
  document.getElementById('histCount').textContent = all.length;
  const list = document.getElementById('histList');
  if (!list) return;

  const filtered = filterRecords(all);
  if (!filtered.length) {
    list.innerHTML = all.length
      ? `<div class="empty"><div class="ico">🔍</div><p>${t('history.noResults')}</p></div>`
      : `<div class="empty"><div class="ico">📋</div><p>${t('history.empty')}<br>${t('history.empty.hint')}</p></div>`;
    return;
  }

  list.innerHTML = filtered.map(tx => {
    const m = MODULE_DEF[tx.module];
    const ttlH = tx.expireAt
      ? Math.max(0, Math.round((new Date(tx.expireAt) - Date.now()) / 3600000))
      : null;
    const expiring = ttlH !== null && ttlH < 12;
    return `
      <div class="hist-item" style="--c:${m.accent}" data-id="${tx.id}">
        <div class="hist-main">
          <div class="hist-ref">
            ${esc(tx.ref)}
            <span class="pill acc">${esc(t('mod.' + tx.module + '.tag'))}</span>
            ${tx.archived
              ? `<span class="pill ok">${t('history.archived')}</span>`
              : `<span class="pill warn">${t('history.unarchived')}</span>`}
            ${expiring ? `<span class="pill warn">${t('history.purgeIn')} ${ttlH}${t('history.hours')}</span>` : ''}
          </div>
          <div class="hist-sub">${fmtDateTime(tx.createdAt)}</div>
          <div class="hist-sub">👤 ${esc(tx.staff)} • 👮 ${esc(tx.guard)} • 📷 ${(tx.photos||[]).length} • 📦 ${tx.items.length}</div>
        </div>
        <div class="hist-actions">
          <button class="icon-btn" data-act="view" title="${t('history.view')}">👁</button>
          <button class="icon-btn" data-act="share" title="${t('history.share')}">📲</button>
          <button class="icon-btn" data-act="pdf" title="${t('history.pdf')}">📄</button>
          <button class="icon-btn danger" data-act="del" title="${t('history.delete')}">🗑</button>
        </div>
      </div>`;
  }).join('');
}

function initHistory() {
  const list = document.getElementById('histList');
  if (!list || list._init) return;
  list._init = true;

  list.addEventListener('click', async e => {
    const item = e.target.closest('.hist-item');
    if (!item) return;
    const id = item.dataset.id;
    const all = loadAll();
    const tx = all.find(t => t.id === id);
    if (!tx) return;

    const btn = e.target.closest('[data-act]');
    const act = btn ? btn.dataset.act : 'view';

    if (act === 'del') {
      if (!confirm(t('history.deleteConfirm'))) return;
      saveAll(all.filter(t => t.id !== id));
      try { await idbDeleteByRef(tx.ref); } catch {}
      try { if (tx.id) await idbDeleteByTxId(tx.id); } catch {}
      renderHistory(); renderProfile(); refreshDatalists();
      return toast(t('history.deleted'));
    }

    if (act === 'pdf') {
      toast(t('history.pdfGenerating'));
      try {
        if (!firebaseReady) {
          const stored = await idbGet(`archive::${tx.ref}::pdf`);
          if (stored && stored.blob) {
            downloadBlob(stored.blob, `${tx.ref}.pdf`);
            return toast(t('history.pdfReady'));
          }
        }
        const blob = await buildPdfBlob(tx);
        downloadBlob(blob, `${tx.ref}.pdf`);
        toast(t('history.pdfReady'));
      } catch (e) { toast(t('history.pdfError') + ' ' + e.message); }
      return;
    }

    if (act === 'share') {
      activeTx = tx;
      try { activeCardUrl = await generateCard(tx); } catch {}
      await shareWhatsApp();
      return;
    }

    showCard(tx);
  });

  const searchInput = document.getElementById('histSearch');
  if (searchInput) searchInput.addEventListener('input', e => {
    historyQuery = e.target.value.trim();
    renderHistory();
  });

  $$('.hist-filter').forEach(btn => {
    if (btn._init) return;
    btn._init = true;
    btn.addEventListener('click', () => {
      $$('.hist-filter').forEach(b => b.classList.toggle('active', b === btn));
      historyFilter = btn.dataset.filter;
      renderHistory();
    });
  });

  const expAll = document.getElementById('btnExportAll');
  if (expAll && !expAll._init) {
    expAll._init = true;
    expAll.onclick = () => {
      const all = loadAll();
      if (!all.length) return toast(t('history.noExport'));
      const payload = {
        schema: 'digitalstock.full-export.v1',
        exportedAt: new Date().toISOString(),
        hotel: settings.hotel,
        count: all.length,
        records: all
      };
      downloadBlob(
        new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' }),
        `DS-EXPORT-${new Date().toISOString().slice(0,10)}.json`
      );
      toast(t('history.exported'));
    };
  }

  const impAll = document.getElementById('btnImportAll');
  const impInput = document.getElementById('importInput');
  if (impAll && !impAll._init) {
    impAll._init = true;
    impAll.onclick = () => impInput.click();
    impInput.addEventListener('change', async e => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        const text = await file.text();
        const data = JSON.parse(text);
        if (!data.records || !Array.isArray(data.records)) throw new Error(t('history.importInvalid'));
        if (!confirm(t('history.importConfirm'))) return;
        const existing = loadAll();
        const ids = new Set(existing.map(t => t.id));
        let added = 0;
        for (const rec of data.records) {
          if (!rec.id || ids.has(rec.id)) continue;
          existing.unshift(rec); added++;
        }
        existing.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
        saveAll(existing);
        renderHistory(); renderProfile(); refreshDatalists();
        toast(t('history.imported'));
      } catch (err) {
        toast(t('history.importInvalid') + ': ' + err.message);
      }
      e.target.value = '';
    });
  }
}
