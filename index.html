<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0f18">
<title>Digital Stock | ديجيتال ستوك</title>
<!-- استدعاء خطوط Google بتصميم عصري -->
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- استدعاء jsPDF مع خاصية defer لتسريع تحميل الصفحة -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>

<style>
/* ================================================================
   [1] DESIGN SYSTEM & CSS VARIABLES
   ================================================================ */
*, *::before, *::after { box-sizing: border-box; }

:root[data-theme="dark"] {
  --bg: #0a0f18; --surface: #131a26; --surface-2: #1c2636; --surface-3: #283548;
  --line: #2a374a; --txt: #f0f4f8; --muted: #94a3b8; --muted-2: #64748b;
  --accent: #3b82f6; --accent-glow: rgba(59, 130, 246, 0.4);
  --ok: #10b981; --warn: #f59e0b; --danger: #ef4444;
  --radius: 16px; --radius-sm: 10px;
  --font-ar: 'Cairo', sans-serif; --font-en: 'Inter', sans-serif;
}

:root[data-theme="light"] {
  --bg: #f8fafc; --surface: #ffffff; --surface-2: #f1f5f9; --surface-3: #e2e8f0;
  --line: #cbd5e1; --txt: #0f172a; --muted: #64748b; --muted-2: #94a3b8;
  --accent: #2563eb; --accent-glow: rgba(37, 99, 235, 0.3);
  --ok: #059669; --warn: #d97706; --danger: #dc2626;
  --radius: 16px; --radius-sm: 10px;
  --font-ar: 'Cairo', sans-serif; --font-en: 'Inter', sans-serif;
}

html, body { margin: 0; padding: 0; width: 100%; min-height: 100vh; overflow-x: hidden; }
body {
  font-family: var(--font-ar);
  background-color: var(--bg); color: var(--txt);
  -webkit-font-smoothing: antialiased;
  transition: background-color 0.4s ease, color 0.4s ease;
}

button, input, select, textarea { font-family: inherit; font-size: 15px; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }
::-webkit-scrollbar-track { background: transparent; }

/* ================================================================
   [2] FULL-SCREEN AUTHENTICATION (PRO LOGIN)
   ================================================================ */
#auth-screen {
  position: fixed; inset: 0; z-index: 1000;
  background: radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
              radial-gradient(circle at 90% 80%, rgba(139, 92, 246, 0.15) 0%, transparent 50%), var(--bg);
  display: flex; align-items: center; justify-content: center;
  transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.6s;
  padding: 20px;
}
#auth-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

.login-glass {
  background: color-mix(in srgb, var(--surface) 70%, transparent);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid color-mix(in srgb, var(--txt) 10%, transparent);
  border-radius: 24px; padding: 40px; width: 100%; max-width: 420px;
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
  transform: translateY(0); transition: transform 0.4s;
  animation: slideUp 0.6s ease-out forwards;
}
@keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

.brand-header { text-align: center; margin-bottom: 30px; }
.brand-logo {
  width: 70px; height: 70px; margin: 0 auto 15px;
  background: linear-gradient(135deg, #3b82f6, #8b5cf6);
  border-radius: 20px; display: flex; align-items: center; justify-content: center;
  font-size: 28px; color: white; font-weight: 900; font-family: var(--font-en);
  box-shadow: 0 10px 25px var(--accent-glow);
}
.brand-title { font-size: 24px; font-weight: 800; margin: 0; letter-spacing: -0.5px; }
.brand-subtitle { font-size: 14px; color: var(--muted); margin-top: 5px; }

/* ================================================================
   [3] MAIN APP LAYOUT (Hidden initially)
   ================================================================ */
#app-screen {
  opacity: 0; visibility: hidden; pointer-events: none;
  transition: opacity 0.6s 0.2s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.6s;
  display: flex; flex-direction: column; min-height: 100vh;
}
#app-screen.visible { opacity: 1; visibility: visible; pointer-events: auto; }

.appbar { position: sticky; top: 0; z-index: 50; background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid var(--line); }
.appbar-in { max-width: 800px; margin: 0 auto; display: flex; align-items: center; gap: 15px; padding: 12px 20px 8px; }
.mini-logo { width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg, #3b82f6, #8b5cf6); display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-family: var(--font-en); font-size: 12px; }
.titles { flex: 1; }
.t1 { font-size: 16px; font-weight: 800; }
.t2 { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; margin-top: 2px; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn) 20%, transparent); transition: 0.3s;}
.status-dot.online { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 20%, transparent); }

.tabs { max-width: 800px; margin: 0 auto; display: flex; gap: 8px; padding: 8px 20px 12px; overflow-x: auto; }
.tab { padding: 10px 18px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); font-size: 14px; font-weight: 700; cursor: pointer; transition: 0.2s; white-space: nowrap; }
.tab:hover { color: var(--txt); background: var(--surface-3); }
.tab.active { background: var(--accent); color: white; border-color: transparent; box-shadow: 0 8px 20px var(--accent-glow); }
.badge { display: inline-block; padding: 2px 8px; margin-right: 8px; background: rgba(255,255,255,0.2); border-radius: 99px; font-size: 11px; }

main { max-width: 800px; margin: 0 auto; padding: 20px; flex: 1; width: 100%; }
.view { display: none; animation: fadeIn 0.4s ease-out; }
.view.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* ================================================================
   [4] COMPONENTS (CARDS, INPUTS, BUTTONS)
   ================================================================ */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
.card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
.card-head h2 { font-size: 17px; font-weight: 800; margin: 0; flex: 1; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 20%, transparent); }

.field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
.field > span { font-size: 13px; font-weight: 700; color: var(--muted); }
.inp { width: 100%; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-sm); color: var(--txt); padding: 12px 16px; font-size: 15px; transition: 0.2s; }
.inp:focus { border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 4px var(--accent-glow); outline: none; }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
@media(max-width:600px) { .grid2 { grid-template-columns: 1fr; } }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 20px; border-radius: var(--radius-sm); font-size: 15px; font-weight: 700; cursor: pointer; transition: 0.2s; border: none; }
.btn:active { transform: scale(0.98); }
.btn:disabled { opacity: 0.6; cursor: not-allowed; }
.btn.primary { background: var(--accent); color: white; box-shadow: 0 4px 14px var(--accent-glow); }
.btn.primary:hover { filter: brightness(1.1); box-shadow: 0 6px 20px var(--accent-glow); }
.btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--txt); }
.btn.ghost:hover { background: var(--surface-2); }
.btn.wa { background: #25D366; color: white; box-shadow: 0 4px 14px rgba(37, 211, 102, 0.3); }
.btn.danger { background: color-mix(in srgb, var(--danger) 15%, transparent); color: var(--danger); }

.icon-btn { width: 38px; height: 38px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); color: var(--txt); display: grid; place-items: center; cursor: pointer; transition: 0.2s; }
.icon-btn:hover { background: var(--surface-3); }

/* ITEMS GRID */
.items-head, .item-row { display: grid; grid-template-columns: 1fr 80px 100px 40px; gap: 10px; align-items: center; }
.items-head { font-size: 12px; font-weight: 800; color: var(--muted-2); margin-bottom: 8px; }
.item-row { margin-bottom: 10px; }

/* MODALS */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 20px; opacity: 0; visibility: hidden; transition: 0.3s; }
.modal-overlay.open { opacity: 1; visibility: visible; }
.modal-box { background: var(--surface); width: 100%; max-width: 500px; border-radius: 20px; border: 1px solid var(--line); box-shadow: 0 25px 50px rgba(0,0,0,0.5); transform: scale(0.95); transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); display: flex; flex-direction: column; max-height: 90vh;}
.modal-overlay.open .modal-box { transform: scale(1); }
.modal-head { padding: 15px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; }
.modal-head h3 { margin: 0; font-size: 18px; }
.modal-body { padding: 20px; overflow-y: auto; }
.modal-foot { padding: 15px 20px; border-top: 1px solid var(--line); display: flex; gap: 10px; }

/* TOAST NOTIFICATION */
#toast { position: fixed; bottom: 30px; left: 50%; transform: translate(-50%, 100px); background: var(--txt); color: var(--bg); padding: 12px 24px; border-radius: 99px; font-weight: 700; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); opacity: 0; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 3000; }
#toast.show { transform: translate(-50%, 0); opacity: 1; }
</style>
</head>
<body>

<!-- ================================================================
     [A] AUTHENTICATION SCREEN (LOGIN)
     ================================================================ -->
<div id="auth-screen">
  <div class="login-glass">
    <div class="brand-header">
      <div class="brand-logo">DS</div>
      <h1 class="brand-title">Digital Stock</h1>
      <p class="brand-subtitle">نظام الإدارة والأمن الذكي - Les Oliviers Palace</p>
    </div>
    
    <div id="login-form-container">
      <label class="field">
        <span>البريد الإلكتروني</span>
        <input type="email" class="inp" id="loginEmail" placeholder="admin@hotel.com" autocomplete="email">
      </label>
      <label class="field" style="margin-bottom: 25px;">
        <span>كلمة المرور</span>
        <input type="password" class="inp" id="loginPass" placeholder="••••••••" autocomplete="current-password">
      </label>
      <button type="button" class="btn primary" id="btnLoginBtn" style="width: 100%; height: 48px; font-size: 16px;">
        تسجيل الدخول
      </button>
    </div>
  </div>
</div>

<!-- ================================================================
     [B] MAIN APPLICATION SCREEN
     ================================================================ -->
<div id="app-screen">
  <header class="appbar">
    <div class="appbar-in">
      <div class="mini-logo">DS</div>
      <div class="titles">
        <div class="t1">Digital Stock</div>
        <div class="t2">
          <span class="status-dot" id="netStatusDot"></span>
          <span id="netStatusText">غير متصل</span> | 
          <span id="currentUserDisplay" style="color: var(--accent); font-weight: 700;">👤 ...</span>
        </div>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="btnThemeToggle" title="Dark/Light Mode">🌓</button>
        <button class="icon-btn" id="btnSettings" title="الإعدادات">⚙</button>
      </div>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab active" data-view="warehouse">خروج مخزن (WER)</button>
      <button class="tab" data-view="bon">إذن خروج (BDS)</button>
      <button class="tab" data-view="history">السجل <span class="badge" id="histCount">0</span></button>
    </nav>
  </header>

  <main>
    <section class="view active" id="view-warehouse"></section>
    <section class="view" id="view-bon"></section>
    <section class="view" id="view-history">
      <div id="histList"></div>
    </section>
  </main>
</div>

<!-- ================================================================
     [C] MODALS
     ================================================================ -->
<!-- Settings Modal -->
<div class="modal-overlay" id="setModal">
  <div class="modal-box">
    <div class="modal-head">
      <h3>الإعدادات</h3>
      <button class="icon-btn close-modal">✕</button>
    </div>
    <div class="modal-body">
      <label class="field"><span>اسم المنشأة</span><input class="inp" id="setHotel" value="Les Oliviers Palace"></label>
      <label class="field"><span>هاتف المشرف (للواتساب)</span><input class="inp" id="setPhone" dir="ltr" placeholder="+216..."></label>
      <hr style="border:0; border-top:1px solid var(--line); margin:20px 0;">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div><strong style="font-size: 14px;">حسابك الحالي</strong><br><span id="settingEmail" style="font-size: 12px; color: var(--muted);">...</span></div>
        <button class="btn danger sm" id="btnLogoutBtn">تسجيل الخروج</button>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn primary close-modal" style="flex:1" id="btnSaveSettings">حفظ الإعدادات</button>
    </div>
  </div>
</div>

<!-- Card Preview Modal -->
<div class="modal-overlay" id="cardModal">
  <div class="modal-box" style="max-width: 600px;">
    <div class="modal-head">
      <h3 id="cardModalTitle">بطاقة المعاملة</h3>
      <button class="icon-btn close-modal">✕</button>
    </div>
    <div class="modal-body" style="background:#e2e8f0; text-align:center; padding:10px;">
      <div id="cardModalBody"></div>
    </div>
    <div class="modal-foot">
      <button class="btn wa" id="btnShareWA">📲 واتساب</button>
      <button class="btn ghost" id="btnDownloadPdf">⬇ PDF</button>
    </div>
  </div>
</div>

<input type="file" id="fileInput" accept="image/*" hidden>
<div id="toast"></div>

<!-- ================================================================
     [D] JAVASCRIPT (FIREBASE & APP LOGIC)
     ================================================================ -->
<script type="module">
// استدعاء مكتبات Firebase - الإصدار 10 - ES Modules
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, doc, runTransaction, serverTimestamp, Timestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getStorage, ref, uploadString, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

/* ------------------------------------------------------------------
   1. FIREBASE SETUP & CONFIG
   ------------------------------------------------------------------ */
const firebaseConfig = {
  apiKey: "AIzaSyDHoeuyuIBt00rSWCyU9Vl_xGnWe2hLA7U",
  authDomain: "digital-stock-8bdff.firebaseapp.com",
  projectId: "digital-stock-8bdff",
  storageBucket: "digital-stock-8bdff.firebasestorage.app",
  messagingSenderId: "514830429461",
  appId: "1:514830429461:web:51bb22607b2a9782890d1c"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

// Variables Globales
let currentGuard = "";
const STORE_KEY = 'ds.transactions.v2';
const drafts = { warehouse: [], bon: [] };
let activeTx = null;
let activeCardUrl = null;

// Helpers
const $ = s => document.querySelector(s); const $$ = s => [...document.querySelectorAll(s)];
const showToast = (msg) => { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 3000); };

/* ------------------------------------------------------------------
   2. AUTHENTICATION LOGIC (Persistence enabled for GitHub Pages)
   ------------------------------------------------------------------ */
// تعيين جلسة دائمة لحفظ الدخول بعد التحديث
setPersistence(auth, browserLocalPersistence).catch(console.error);

$('#btnLoginBtn').addEventListener('click', async () => {
  const email = $('#loginEmail').value.trim();
  const pass = $('#loginPass').value;
  const btn = $('#btnLoginBtn');
  
  if(!email || !pass) return showToast("أدخل البريد وكلمة المرور");
  btn.disabled = true; btn.innerHTML = '<span class="spinner" style="width:20px;height:20px;margin:0;border-width:2px;border-top-color:#fff;"></span>';
  
  try {
    await signInWithEmailAndPassword(auth, email, pass);
    showToast("نجاح الدخول!");
  } catch (err) {
    showToast("بيانات خاطئة أو لا يوجد اتصال");
    console.error(err);
  }
  btn.disabled = false; btn.textContent = 'تسجيل الدخول';
});

// دعم ضغط Enter
$('#loginPass').addEventListener('keypress', e => { if(e.key === 'Enter') $('#btnLoginBtn').click(); });

$('#btnLogoutBtn').addEventListener('click', async () => {
  if(confirm("تسجيل الخروج؟")) {
    await signOut(auth);
    $('.modal-overlay.open')?.classList.remove('open');
    showToast("تم تسجيل الخروج");
  }
});

// مراقب حالة المستخدم (يُظهر ويُخفي الشاشات)
onAuthStateChanged(auth, (user) => {
  const authScreen = $('#auth-screen');
  const appScreen = $('#app-screen');
  
  if (user) {
    currentGuard = user.displayName || user.email.split('@')[0];
    $('#currentUserDisplay').textContent = `👤 ${currentGuard}`;
    $('#settingEmail').textContent = user.email;
    
    // إخفاء شاشة الدخول وإظهار التطبيق
    authScreen.classList.add('hidden');
    appScreen.classList.add('visible');
    
    initForms(); // بناء النماذج
    renderHistory();
  } else {
    currentGuard = "";
    // إرجاع شاشة الدخول
    authScreen.classList.remove('hidden');
    appScreen.classList.remove('visible');
    $('#loginPass').value = '';
  }
});

/* ------------------------------------------------------------------
   3. UI & THEME LOGIC
   ------------------------------------------------------------------ */
$('#btnThemeToggle').onclick = () => {   const root = document.documentElement;   root.setAttribute('data-theme', root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'); };  // إدارة نوافذ Modal $$('.close-modal').forEach(btn => btn.onclick = e => e.target.closest('.modal-overlay').classList.remove('open'));
$('#btnSettings').onclick = () => $('#setModal').classList.add('open');
$('#btnSaveSettings').onclick = () => { 
  localStorage.setItem('ds.hotel', $('#setHotel').value);
  localStorage.setItem('ds.phone', $('#setPhone').value);
  $('#setModal').classList.remove('open'); showToast("تم الحفظ"); 
};

// التبويبات Tabs
$('#tabs').onclick = e => {
  const t = e.target.closest('.tab'); if(!t) return;
  $$('.tab').forEach(x => x.classList.toggle('active', x === t));$$
('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + t.dataset.view));
};

// حالة الاتصال
const updateNetStatus = () => {
  const on = navigator.onLine;
  $('#netStatusDot').className = `status-dot ${on?'online':''}`;
  $('#netStatusText').textContent = on ? 'متصل (سحابي)' : 'مفصول (محلي)';
};
window.addEventListener('online', updateNetStatus);
window.addEventListener('offline', updateNetStatus);
updateNetStatus();

/* ------------------------------------------------------------------
   4. FORM BUILDER & DATA HANDLING
   ------------------------------------------------------------------ */
const MODULES = {
  warehouse: { key: 'warehouse', label: 'خروج مخزن (WER)', c: '#10b981', prefix: 'WER',
    html: `
      <div class="grid2">
        <label class="field"><span>القسم المستلم *</span><select class="inp" name="dep" required><option value="">- إختر -</option><option>المطبخ</option><option>المطعم</option><option>الصيانة</option><option>الإدارة</option></select></label>
        <label class="field"><span>رقم أمر الشراء (اختياري)</span><input class="inp" name="po"></label>
      </div>`
  },
  bon: { key: 'bon', label: 'إذن خروج نهائي (BDS)', c: '#f59e0b', prefix: 'BDS',
    html: `
      <div class="grid2">
        <label class="field"><span>جهة الوصول *</span><input class="inp" name="dest" required></label>
        <label class="field"><span>السبب *</span><select class="inp" name="reason" required><option value="">- إختر -</option><option>إرجاع مورد</option><option>صيانة خارجية</option><option>إتلاف</option></select></label>
        <label class="field"><span>المركبة / السائق</span><input class="inp" name="veh"></label>
        <label class="field"><span>المفوِّض (المدير)</span><input class="inp" name="authBy"></label>
      </div>`
  }
};

function initForms() {
  ['warehouse', 'bon'].forEach(k => {
    const m = MODULES[k];
    $(`#view-${k}`).innerHTML = `
      <form id="f-${k}" onsubmit="event.preventDefault();">
        <div class="card"><div class="card-head"><span class="dot" style="--c:${m.c}"></span><h2>${m.label}</h2></div>
          <div class="grid2" style="margin-bottom:15px;">
            <label class="field"><span>الحارس (أنت)</span><input class="inp" name="guard" value="${currentGuard}" readonly style="opacity:0.7"></label>
            <label class="field"><span>المستخرج (الموظف) *</span><input class="inp" name="staff" required></label>
          </div>
          ${m.html}
          <label class="field"><span>ملاحظات</span><textarea class="inp" name="notes" rows="2"></textarea></label>
        </div>
        <div class="card"><div class="card-head"><span class="dot" style="--c:${m.c}"></span><h2>الأصناف</h2></div>
          <div class="items-head"><span>التسمية</span><span style="text-align:center">الكمية</span><span>الوحدة</span><span></span></div>
          <div id="it-${k}"></div>
          <button type="button" class="btn ghost" id="add-${k}" style="width:100%; margin-top:10px;">+ إضافة صنف</button>
        </div>
        <button type="button" class="btn primary" id="btn-${k}" style="width:100%; height:50px; --c:${m.c}">✓ اعتماد وإصدار البطاقة</button>
      </form>`;
    
    // إضافة صف مبدئي
    addItemRow(k);
    $(`#add-${k}`).onclick = () => addItemRow(k);
    $(`#btn-${k}`).onclick = () => submitForm(k);
  });
}

function addItemRow(k) {
  const div = document.createElement('div'); div.className = 'item-row';
  div.innerHTML = `<input class="inp n" required placeholder="اسم الصنف"><input class="inp q i-qty" type="number" min="0" required placeholder="0"><select class="inp u"><option>حبة</option><option>كغ</option><option>لتر</option><option>كرتون</option></select><button type="button" class="icon-btn danger del">✕</button>`;
  $(`#it-${k}`).appendChild(div);
  div.querySelector('.del').onclick = () => { div.remove(); if(!$(`#it-${k}`).children.length) addItemRow(k); };
}

/* ------------------------------------------------------------------
   5. SUBMIT & FIREBASE TRANSACTION
   ------------------------------------------------------------------ */
async function submitForm(k) {
  const form = $(`#f-${k}`), fd = new FormData(form);
  if(!form.checkValidity()) { form.reportValidity(); return; }
  
  const items = $$(`#it-${k} .item-row`).map(r => ({ n: r.querySelector('.n').value, q: r.querySelector('.q').value, u: r.querySelector('.u').value })).filter(i => i.n && i.q);
  if(!items.length) return showToast("أضف صنفاً واحداً على الأقل");

  const btn = $(`#btn-${k}`); const oldTxt = btn.textContent;
  btn.disabled = true; btn.textContent = 'جاري الحفظ في السحابة...';

  try {
    const hotel = localStorage.getItem('ds.hotel') || 'Les Oliviers Palace';
    const dateKey = new Date().toISOString().slice(0,10).replace(/-/g,'');
    const counterRef = doc(db, 'counters', `${MODULES[k].prefix}_${dateKey}`);
    const txRef = doc(collection(db, 'transactions'));
    let refNum = "";

    // Transaction لحفظ التسلسل بشكل آمن سحابياً
    await runTransaction(db, async (trx) => {
      const snap = await trx.get(counterRef);
      let seq = snap.exists() ? snap.data().seq + 1 : 1;
      trx.set(counterRef, { seq, updatedAt: serverTimestamp() }, {merge:true});
      refNum = `${MODULES[k].prefix}-${dateKey}-${String(seq).padStart(4,'0')}`;
      
      trx.set(txRef, {
        ref: refNum, module: k, hotel,
        guard: currentGuard, staff: fd.get('staff'),
        dep: fd.get('dep')||'', po: fd.get('po')||'', dest: fd.get('dest')||'', reason: fd.get('reason')||'', veh: fd.get('veh')||'', authBy: fd.get('authBy')||'', notes: fd.get('notes')||'',
        items, createdAt: serverTimestamp(), createdBy: auth.currentUser.uid
      });
    });

    // حفظ محلي للعرض السريع
    const txData = { id: txRef.id, ref: refNum, module: k, hotel, guard: currentGuard, staff: fd.get('staff'), items, createdAt: new Date().toISOString() };
    const all = JSON.parse(localStorage.getItem(STORE_KEY)||'[]'); all.unshift(txData); localStorage.setItem(STORE_KEY, JSON.stringify(all.slice(0,50)));
    
    form.reset(); $(`#it-${k}`).innerHTML=''; addItemRow(k); renderHistory();
    showToast(`تم الحفظ: ${refNum}`);
    
    // عرض البطاقة مباشرة
    showCard(txData);
    
  } catch(e) {
    console.error(e); showToast("خطأ في الاتصال بقاعدة البيانات");
  }
  btn.disabled = false; btn.textContent = oldTxt;
}

/* ------------------------------------------------------------------
   6. CARD GENERATION (HTML to Canvas/DataURL via pure JS)
   ------------------------------------------------------------------ */
function showCard(tx) {
  activeTx = tx;
  $('#cardModalTitle').textContent = tx.ref;
  const m = MODULES[tx.module];
  
  // تصميم البطاقة كـ HTML نقي لسهولة قراءته
  const html = `
    <div id="printArea" style="background:#fff; color:#000; padding:30px; text-align:right; font-family:'Cairo',sans-serif; border-radius:10px; box-shadow:0 10px 30px rgba(0,0,0,0.1); width:100%;">
      <div style="border-bottom:3px solid ${m.c}; padding-bottom:15px; margin-bottom:20px; display:flex; justify-content:space-between; align-items:center;">
        <div><h1 style="margin:0; font-size:24px; color:${m.c}">${m.title}</h1><p style="margin:0; color:#666;">${tx.hotel}</p></div>
        <div style="text-align:left;"><h2 style="margin:0; font-size:20px;">${tx.ref}</h2><p style="margin:0; color:#666;">${new Date(tx.createdAt).toLocaleString('ar-EG')}</p></div>
      </div>
      <div style="display:flex; justify-content:space-between; margin-bottom:20px; background:#f8f9fa; padding:15px; border-radius:8px;">
        <div><strong>الحارس:</strong> ${tx.guard}</div>
        <div><strong>المستخرج:</strong> ${tx.staff}</div>
      </div>
      <table style="width:100%; border-collapse:collapse; margin-bottom:20px;">
        <thead><tr style="background:${m.c}; color:#fff;"><th style="padding:10px; border:1px solid #ddd;">التسمية</th><th style="padding:10px; border:1px solid #ddd;">الكمية</th><th style="padding:10px; border:1px solid #ddd;">الوحدة</th></tr></thead>
        <tbody>
          ${tx.items.map(i => `<tr><td style="padding:10px; border:1px solid #ddd;">${i.n}</td><td style="padding:10px; border:1px solid #ddd; text-align:center;">${i.q}</td><td style="padding:10px; border:1px solid #ddd; text-align:center;">${i.u}</td></tr>`).join('')}
        </tbody>
      </table>
      <div style="display:flex; justify-content:space-between; margin-top:50px; color:#666;">
        <div style="border-top:1px solid #ccc; padding-top:10px; width:40%; text-align:center;">توقيع الحارس</div>
        <div style="border-top:1px solid #ccc; padding-top:10px; width:40%; text-align:center;">توقيع المستلم</div>
      </div>
    </div>
  `;
  $('#cardModalBody').innerHTML = html;
  $('#cardModal').classList.add('open');
}

// دالة مبسطة لتحويل منطقة الـ HTML إلى صورة للواتساب
$('#btnShareWA').onclick = () => {
  if(!activeTx) return;
  const t = activeTx;
  const txt = `*${MODULES[t.module].label}*\n🏨 ${t.hotel}\n📄 ${t.ref}\n\nالحارس: ${t.guard}\nالمستلم: ${t.staff}\n\n*الأصناف:*\n${t.items.map(i=>`- ${i.n} (${i.q}${i.u})`).join('\n')}`;
  const phone = (localStorage.getItem('ds.phone')||'').replace(/[^\d]/g,'');
  window.open(`https://wa.me/${phone}?text=${encodeURIComponent(txt)}`, '_blank');
};

$('#btnDownloadPdf').onclick = () => {
  if(!window.jspdf) { showToast("جاري تحميل مكتبة PDF، انتظر ثانية..."); return; }
  const doc = new window.jspdf.jsPDF({ format: 'a4', orientation: 'p' });
  // استخدام خط افتراضي بسيط لتفادي مشاكل ترميز اللغة في المتصفحات
  doc.setFontSize(22); doc.text(activeTx.ref, 20, 30);
  doc.setFontSize(12); doc.text(`Hotel: ${activeTx.hotel}`, 20, 45);
  doc.text(`Guard: ${activeTx.guard} | Staff: ${activeTx.staff}`, 20, 55);
  let y = 75;
  activeTx.items.forEach(i => { doc.text(`- ${i.q} ${i.u} : ${i.n}`, 20, y); y+=10; });
  doc.save(`${activeTx.ref}.pdf`);
};

/* ------------------------------------------------------------------
   7. HISTORY RENDER
   ------------------------------------------------------------------ */
function renderHistory() {
  const all = JSON.parse(localStorage.getItem(STORE_KEY)||'[]');
  $('#histCount').textContent = all.length;
  $('#histList').innerHTML = all.length ? all.map(t => `
    <div class="card" style="padding:12px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; border-right:4px solid ${MODULES[t.module].c}">
      <div>
        <h4 style="margin:0 0 5px;">${t.ref}</h4>
        <div style="font-size:12px; color:var(--muted)">${new Date(t.createdAt).toLocaleString('ar-EG')} • 👤 ${t.staff}</div>
      </div>
      <button class="btn ghost sm" onclick='showCard(${JSON.stringify(t)})'>عرض</button>
    </div>
  `).join('') : '<p style="text-align:center; color:var(--muted); padding:40px;">لا توجد حركات مسجلة</p>';
}

// جعل showCard متاحة عالمياً لزر "عرض"
window.showCard = showCard;

</script>
</body>
</html>
