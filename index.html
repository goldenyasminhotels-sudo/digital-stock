      <h2 class="profile-name">${esc(currentAgent || '—')}</h2>
      <div class="profile-role">${t('profile.role')}</div>
      ${currentEmail ? `<div class="profile-email">${esc(currentEmail)}</div>` : ''}
    </div>

    <div class="stats-grid">
      <div class="stat-card" style="--c:#3b82f6">
        <span class="stat-ic">📊</span>
        <div class="stat-val">${total}</div>
        <div class="stat-lbl">${t('profile.stats.total')}</div>
      </div>
      <div class="stat-card" style="--c:#10b981">
        <span class="stat-ic">📅</span>
        <div class="stat-val">${today}</div>
        <div class="stat-lbl">${t('profile.stats.today')}</div>
      </div>
      <div class="stat-card" style="--c:#f59e0b">
        <span class="stat-ic">📈</span>
        <div class="stat-val">${week}</div>
        <div class="stat-lbl">${t('profile.stats.week')}</div>
      </div>
      <div class="stat-card" style="--c:#8b5cf6">
        <span class="stat-ic">🗄️</span>
        <div class="stat-val">${archived}</div>
        <div class="stat-lbl">${t('profile.stats.archived')}</div>
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <span class="dot" style="--c:#3b82f6"></span>
        <h2>${t('profile.activity')}</h2>
      </div>
      ${recent.length
        ? recent.map(tx => {
            const m = MODULE_DEF[tx.module];
            return `
              <div class="activity-item" data-id="${esc(tx.id)}">
                <div class="activity-badge" style="background:color-mix(in srgb,${m.accent} 20%,transparent);color:${m.accent}">
                  ${tx.module === 'warehouse' ? '🏭' : '🚚'}
                </div>
                <div class="activity-main">
                  <div class="activity-t">
                    ${esc(tx.ref)}
                    <span style="font-size:10.5px;color:${m.accent};font-weight:700;">${esc(t('mod.'+tx.module+'.tag'))}</span>
                  </div>
                  <div class="activity-s">${fmtDateTime(tx.createdAt)} • 👤 ${esc(tx.staff)} • 📦 ${tx.items.length}</div>
                </div>
              </div>`;
          }).join('')
        : `<p class="hint" style="text-align:center;padding:20px;">${t('profile.noActivity')}</p>`}
    </div>

    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;">
      <button class="btn ghost" id="profSettingsBtn" style="flex:1;">${t('profile.settings')}</button>
      <button class="btn danger" id="profLogoutBtn" style="flex:1;">${t('profile.logout')}</button>
    </div>
  `;

  // Wire recent activity click
  host.querySelectorAll('.activity-item').forEach(el => {
    el.onclick = () => {
      const tx = loadAll().find(x => x.id === el.dataset.id);
      if (tx) showCard(tx);
    };
  });

  const s = document.getElementById('profSettingsBtn');
  if (s) s.onclick = () => document.getElementById('btnSettingsClick')?.click();

  const l = document.getElementById('profLogoutBtn');
  if (l) l.onclick = () => document.getElementById('btnLogoutBtn')?.click();
}

/* ================================================================
   MODALS & SETTINGS
   ================================================================ */
function closeModals() {
  $$('.modal-overlay').forEach(m => m.classList.remove('open'));
  activeTx = null;
  activeCardUrl = null;
}

function initModals() {
  if (initModals._done) return;
  initModals._done = true;

  $$('.close-modal').forEach(btn => {
    btn.addEventListener('click', e => {
      e.target.closest('.modal-overlay')?.classList.remove('open');
    });
  });
  document.addEventListener('click', e => {
    if (e.target.classList.contains('modal-overlay')) {
      e.target.classList.remove('open');
    }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModals(); });

  const btnSettings = document.getElementById('btnSettings');
  if (btnSettings) {
    btnSettings.onclick = async () => {
      document.getElementById('setHotel').value = settings.hotel;
      document.getElementById('setPhone').value = settings.phone;
      const stored = localStorage.getItem('ds.fbConfig');
      document.getElementById('setFbConfig').value = stored || '';
      const sz = await idbSizeEstimate();
      document.getElementById('storageInfo').textContent = sz;
      document.getElementById('setModal').classList.add('open');
    };
    // Hidden trigger for profile button
    const hidden = document.createElement('button');
    hidden.id = 'btnSettingsClick';
    hidden.style.display = 'none';
    hidden.onclick = btnSettings.onclick;
    document.body.appendChild(hidden);
  }

  const btnSave = document.getElementById('btnSaveSettings');
  if (btnSave) btnSave.onclick = () => {
    settings.hotel = (document.getElementById('setHotel').value || 'Les Oliviers Palace').trim();
    settings.phone = (document.getElementById('setPhone').value || '').trim();
    saveSettings();
    document.getElementById('hotelLabel').textContent = settings.hotel;

    const raw = document.getElementById('setFbConfig').value.trim();
    if (raw) {
      try {
        JSON.parse(raw);
        localStorage.setItem('ds.fbConfig', raw);
        toast(t('settings.saveAndReload'));
        setTimeout(() => location.reload(), 700);
        return;
      } catch { return toast(t('settings.fbInvalid')); }
    }
    closeModals();
    toast(t('settings.saved'));
  };

  const btnLogout = document.getElementById('btnLogoutBtn');
  if (btnLogout) btnLogout.onclick = async () => {
    if (!confirm(t('settings.logoutConfirm'))) return;
    try { await signOut(auth); } catch {}
    closeModals();
  };

  document.getElementById('btnShareWA').onclick = shareWhatsApp;

  document.getElementById('btnDownloadJpg').onclick = () => {
    if (!activeCardUrl) return;
    downloadDataUrl(activeCardUrl, `${activeTx.ref}.jpg`);
    toast(t('card.jpg'));
  };

  document.getElementById('btnDownloadPdf').onclick = async () => {
    if (!activeTx) return;
    toast(t('history.pdfGenerating'));
    try {
      if (!firebaseReady) {
        const stored = await idbGet(`archive::${activeTx.ref}::pdf`);
        if (stored && stored.blob) {
          downloadBlob(stored.blob, `${activeTx.ref}.pdf`);
          return toast(t('history.pdfReady'));
        }
      }
      const blob = await buildPdfBlob(activeTx, activeCardUrl);
      downloadBlob(blob, `${activeTx.ref}.pdf`);
      toast(t('history.pdfReady'));
    } catch (e) { toast(t('history.pdfError') + ' ' + e.message); }
  };

  document.getElementById('btnDownloadJson').onclick = async () => {
    if (!activeTx) return;
    try {
      if (!firebaseReady) {
        const stored = await idbGet(`archive::${activeTx.ref}::json`);
        if (stored && stored.blob) {
          downloadBlob(stored.blob, `${activeTx.ref}.json`);
          return toast(t('card.json'));
        }
      }
      downloadBlob(buildJsonBlob(activeTx), `${activeTx.ref}.json`);
      toast(t('card.json'));
    } catch { toast('JSON error'); }
  };
}

/* ================================================================
   TABS
   ================================================================ */
function initTabs() {
  const tabsEl = document.getElementById('tabs');
  if (!tabsEl || tabsEl._init) return;
  tabsEl._init = true;
  tabsEl.addEventListener('click', e => {
    const t = e.target.closest('.tab');
    if (!t) return;
    $$('.tab').forEach(x => x.classList.toggle('active', x === t));
    $$('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + t.dataset.view));
    if (t.dataset.view === 'history') renderHistoryBanner();
    if (t.dataset.view === 'profile') renderProfile();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
}

function updateNetStatus() {
  const on = navigator.onLine;
  const dot = document.getElementById('netStatusDot');
  const txt = document.getElementById('netStatusText');
  if (dot) dot.className = `status-dot ${on ? 'online' : ''}`;
  if (txt) txt.textContent = on ? t('status.online') : t('status.offline');
}

function renderHistoryBanner() {
  const host = document.getElementById('histBanner');
  if (!host) return;
  const queue = JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]');
  const parts = [];
  if (!firebaseReady) {
    parts.push(`<div class="banner warn"><span class="b-ic">⚠</span><span>${currentLang === 'ar' ? 'وضع محلي. الصور و PDF و JSON محفوظة في IndexedDB، تُحذف تلقائياً بعد 48 ساعة.' : currentLang === 'fr' ? 'Mode local. Photos, PDF et JSON archivés dans IndexedDB, purgés après 48h.' : 'Local mode. Photos, PDF and JSON stored in IndexedDB, purged after 48h.'}</span></div>`);
  } else {
    parts.push(`<div class="banner ok"><span class="b-ic">✓</span><span>${currentLang === 'ar' ? 'Firebase نشط. عدّادات ذرية + أرشفة سحابية + حذف تلقائي بعد 48 ساعة.' : currentLang === 'fr' ? 'Firebase actif. Compteurs atomiques + archivage cloud + purge automatique après 48h.' : 'Firebase active. Atomic counters + cloud archive + auto-purge after 48h.'}</span></div>`);
  }
  if (queue.length) {
    parts.push(`<div class="banner warn"><span class="b-ic">⏳</span><span><b>${queue.length}</b> ${currentLang === 'ar' ? 'في قائمة الانتظار' : currentLang === 'fr' ? 'en file d\'attente' : 'queued'}</span></div>`);
  }
  host.innerHTML = parts.join('');
}

/* ================================================================
   LANGUAGE
   ================================================================ */
function applyLang() {
  document.documentElement.lang = currentLang;
  document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';

  $$('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  $$('[data-i18n-placeholder]').forEach(el => { el.placeholder = t(el.dataset.i18nPlaceholder); });
  $$('[data-i18n-title]').forEach(el => { el.title = t(el.dataset.i18nTitle); });

  const sel = document.getElementById('langSelect');
  if (sel) sel.value = currentLang;

  document.getElementById('hotelLabel').textContent = settings.hotel;

  // Rebuild forms with new language
  renderForms();
  renderHistory();
  renderProfile();
  renderHistoryBanner();
  updateNetStatus();
}

function initLangSwitcher() {
  const sel = document.getElementById('langSelect');
  if (!sel) return;
  sel.value = currentLang;
  sel.addEventListener('change', () => {
    currentLang = sel.value;
    localStorage.setItem('ds.lang', currentLang);
    applyLang();
  });
}

/* ================================================================
   THEME
   ================================================================ */
function initTheme() {
  const saved = localStorage.getItem('ds.theme') || 'dark';
  document.documentElement.setAttribute('data-theme', saved);
  const btn = document.getElementById('btnThemeToggle');
  if (btn && !btn._init) {
    btn._init = true;
    btn.onclick = () => {
      const root = document.documentElement;
      const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      localStorage.setItem('ds.theme', next);
    };
  }
}

/* ================================================================
   AUTH
   ================================================================ */
function initAuth() {
  const btnLogin = document.getElementById('btnLoginBtn');
  const emailInp = document.getElementById('loginEmail');
  const passInp = document.getElementById('loginPass');

  if (!btnLogin || btnLogin._init) return;
  btnLogin._init = true;

  btnLogin.addEventListener('click', async () => {
    const email = emailInp.value.trim();
    const pass  = passInp.value;
    if (!email || !pass) return toast(t('login.required'));
    btnLogin.disabled = true;
    const old = btnLogin.innerHTML;
    btnLogin.innerHTML = `<span class="spinner-inline"></span> ${t('login.loading')}`;
    try {
      await signInWithEmailAndPassword(auth, email, pass);
    } catch (err) {
      console.error(err);
      toast(t('login.error'));
    } finally {
      btnLogin.disabled = false;
      btnLogin.innerHTML = old;
    }
  });

  emailInp.addEventListener('keydown', e => {
    if (e.key === 'Enter') passInp.focus();
  });
  passInp.addEventListener('keydown', e => {
    if (e.key === 'Enter') btnLogin.click();
  });

  onAuthStateChanged(auth, (user) => {
    const authScreen = document.getElementById('auth-screen');
    const appScreen  = document.getElementById('app-screen');

    if (user) {
      userLoggedIn = true;
      firebaseReady = true;
      currentAgent = user.displayName || user.email.split('@')[0];
      currentEmail = user.email;
      document.getElementById('currentUserDisplay').textContent = `👤 ${currentAgent}`;
      document.getElementById('settingEmail').textContent = user.email;

      // Ensure UI is initialized
      ensureUI();

      authScreen.classList.add('hidden');
      appScreen.classList.add('visible');

      renderHistory();
      renderProfile();
      renderHistoryBanner();
      startRetentionScheduler();

      setTimeout(() => recoverUnarchived().catch(() => {}), 2500);
      setTimeout(flushOfflineQueue, 1500);
    } else {
      userLoggedIn = false;
      firebaseReady = false;
      currentAgent = '';
      currentEmail = '';

      // Still ensure UI so history is usable offline
      ensureUI();

      authScreen.classList.remove('hidden');
      appScreen.classList.remove('visible');
      passInp.value = '';
      setTimeout(() => emailInp.focus(), 500);

      renderHistory();
      renderProfile();
      renderHistoryBanner();
      startRetentionScheduler();
    }
    updateNetStatus();
  });
}

/* ================================================================
   THE KEY FIX — single idempotent UI initialization
   ================================================================ */
function ensureUI() {
  if (uiReady) return;
  uiReady = true;

  loadSettings();
  document.getElementById('hotelLabel').textContent = settings.hotel;

  initTabs();
  initModals();
  renderForms();
  initHistory();
  renderHistory();
  renderProfile();
  renderHistoryBanner();
  initLangSwitcher();
  initTheme();
  applyLang();
}

/* ================================================================
   BOOT
   ================================================================ */
(function boot() {
  loadSettings();
  initTheme();
  initLangSwitcher();

  // Always build UI (works with or without auth)
  ensureUI();

  // Attach auth listeners (they'll call ensureUI again — idempotent)
  initAuth();

  updateNetStatus();
  window.addEventListener('online', () => { updateNetStatus(); flushOfflineQueue(); });
  window.addEventListener('offline', updateNetStatus);

  setTimeout(() => document.getElementById('loginEmail')?.focus(), 300);

  console.log('%c Digital Stock v4 — Ready ', 'background:#3b82f6;color:#fff;padding:4px 8px;border-radius:4px;font-weight:bold;');
})();
</script>
